<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي | انتيكا استور</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "antika-pink": "#FFB6C1",
                        "antika-pink-dark": "#FF69B4",
                        "antika-gold": "#D6C1A6",
                        "antika-gold-dark": "#C4AC8E",
                        "antika-beige": "#FAF0E6",
                        "antika-lavender": "#FFF0F5"
                    },
                    fontFamily: {
                        tajawal: ["Tajawal", "sans-serif"]
                    }
                }
            }
        };
    </script>

    <style>
        body { font-family: "Tajawal", sans-serif; }
        #map { width: 100%; height: 500px; border-radius: 16px; background: #e5e7eb; }
        .breadcrumb-item:not(:last-child)::after {
            content: "›";
            margin: 0 8px;
            color: #D6C1A6;
            font-size: 1.2em;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <antika-announcement-bar></antika-announcement-bar>
    <antika-header></antika-header>

    <nav class="breadcrumb py-3" style="background: linear-gradient(135deg, rgba(255, 182, 193, 0.1), rgba(214, 193, 166, 0.1)); border-bottom: 1px solid rgba(255, 182, 193, 0.2);">
        <div class="container mx-auto px-4">
            <div class="flex items-center text-sm">
                <a href="index.html" class="breadcrumb-item text-antika-gold hover:text-antika-pink-dark transition font-semibold">
                    <i class="fas fa-home ml-1"></i> الرئيسية
                </a>
                <span class="text-gray-500">موقعي</span>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl font-bold text-antika-gold mb-2">موقعي</h1>
            <p class="text-gray-600 mb-8">اختر موقعك واحفظه ليظهر مباشرة عند إتمام الطلب.</p>

            <div id="loading" class="text-center py-8">
                <div class="inline-block animate-spin">
                    <i class="fas fa-spinner text-3xl text-antika-pink"></i>
                </div>
                <p class="text-gray-500 mt-2">جاري التحميل...</p>
            </div>

            <div id="location-manager" class="hidden bg-white rounded-2xl shadow-lg p-6 space-y-6">
                <div id="map-error" class="hidden p-3 rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm"></div>

                <div id="current-location" class="hidden">
                    <h2 class="font-bold text-lg mb-3">موقعك المحفوظ:</h2>
                    <div class="p-4 bg-antika-lavender rounded-lg">
                        <div id="current-label" class="font-bold text-gray-800"></div>
                        <div id="current-coords" class="text-sm text-gray-600 mt-1"></div>
                    </div>
                </div>

                <div id="no-location" class="text-center py-6">
                    <i class="fas fa-map-marked-alt text-4xl text-gray-300 mb-3"></i>
                    <p class="text-gray-500">لا يوجد موقع محفوظ حتى الآن</p>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-3">
                        <label class="block font-bold text-gray-700">حدد موقعك على الخريطة:</label>
                        <button id="use-current-location-btn" type="button" class="text-sm px-3 py-2 rounded-lg border border-antika-gold text-antika-gold hover:bg-antika-beige transition">
                            <i class="fas fa-location-arrow ml-1"></i> موقعي الحالي
                        </button>
                    </div>
                    <div id="map" class="shadow-md"></div>
                    <p class="text-xs text-gray-500 mt-2">انقر على الخريطة لاختيار الموقع بدقة.</p>
                </div>

                <div id="location-info" class="hidden p-4 bg-gray-50 rounded-lg">
                    <div class="text-sm">
                        <span class="font-bold">الإحداثيات:</span>
                        <span id="info-coords"></span>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-gray-700 mb-2">اسم الموقع (مثال: المنزل):</label>
                    <input type="text" id="location-label" placeholder="موقعي" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none">
                </div>

                <div class="flex gap-3">
                    <button id="save-location-btn" class="flex-1 bg-antika-pink text-white py-3 rounded-lg font-bold hover:bg-antika-pink-dark transition">
                        <i class="fas fa-save ml-2"></i> احفظ الموقع
                    </button>
                    <button id="clear-location-btn" class="flex-1 border-2 border-red-500 text-red-500 py-3 rounded-lg font-bold hover:bg-red-50 transition">
                        <i class="fas fa-trash ml-2"></i> احذف الموقع
                    </button>
                </div>
            </div>
        </div>
    </main>

    <antika-footer></antika-footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/auth-sync.js"></script>
    <script src="js/announcement-bar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/maps-provider.js"></script>

    <script>
        const DEFAULT_CENTER = { lat: 24.7136, lng: 46.6753 };
        const DEFAULT_ZOOM = 12;

        let map = null;
        let marker = null;
        let selectedLocation = null;
        let userEmail = "";

        function setButtonLoading(btn, loadingText, loading) {
            if (!btn) return;
            if (loading) {
                btn.dataset.oldHtml = btn.innerHTML;
                btn.disabled = true;
                btn.textContent = loadingText;
            } else {
                btn.disabled = false;
                if (btn.dataset.oldHtml) btn.innerHTML = btn.dataset.oldHtml;
            }
        }

        function showMapError(message) {
            const box = document.getElementById("map-error");
            box.textContent = message;
            box.classList.remove("hidden");
        }

        function updateLocationInfo() {
            const info = document.getElementById("location-info");
            const coords = document.getElementById("info-coords");
            if (!selectedLocation) {
                info.classList.add("hidden");
                return;
            }
            coords.textContent = `${selectedLocation.lat.toFixed(6)}, ${selectedLocation.lng.toFixed(6)}`;
            info.classList.remove("hidden");
        }

        function updateSavedDisplay(label, location) {
            const current = document.getElementById("current-location");
            const none = document.getElementById("no-location");
            if (!location) {
                current.classList.add("hidden");
                none.classList.remove("hidden");
                return;
            }

            current.classList.remove("hidden");
            none.classList.add("hidden");
            document.getElementById("current-label").textContent = label || "موقعي";
            document.getElementById("current-coords").textContent = `${location.lat.toFixed(6)}, ${location.lng.toFixed(6)}`;
        }

        function updateMarkerAndCenter() {
            if (marker) {
                marker.setMap(null);
                marker = null;
            }
            if (!selectedLocation || !map) return;

            marker = new google.maps.Marker({
                map,
                position: { lat: selectedLocation.lat, lng: selectedLocation.lng },
                draggable: true
            });

            marker.addListener("dragend", () => {
                const pos = marker.getPosition();
                selectedLocation = { lat: pos.lat(), lng: pos.lng() };
                updateLocationInfo();
            });

            map.setCenter({ lat: selectedLocation.lat, lng: selectedLocation.lng });
            map.setZoom(15);
        }

        async function ensureGoogleMapsReady() {
            if (!window.MapsProvider || typeof window.MapsProvider.getConfig !== "function") {
                throw new Error("Maps helper not found");
            }
            const cfg = await window.MapsProvider.getConfig();
            if (!cfg || !cfg.googleMapsEnabled || !cfg.googleMapsApiKey) {
                throw new Error("Google Maps key is not configured");
            }
            await window.MapsProvider.loadGoogleMapsApi(cfg.googleMapsApiKey);
        }

        async function initMap() {
            await ensureGoogleMapsReady();

            map = new google.maps.Map(document.getElementById("map"), {
                center: DEFAULT_CENTER,
                zoom: DEFAULT_ZOOM,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
                gestureHandling: "greedy"
            });

            map.addListener("click", (e) => {
                selectedLocation = { lat: e.latLng.lat(), lng: e.latLng.lng() };
                updateMarkerAndCenter();
                updateLocationInfo();
            });
        }

        async function loadSavedLocation() {
            try {
                const result = await API.getUserLocation(userEmail);
                if (!result || !result.location) {
                    updateSavedDisplay("", null);
                    return;
                }

                const lat = Number(result.location.lat);
                const lng = Number(result.location.lng);
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
                    updateSavedDisplay("", null);
                    return;
                }

                selectedLocation = { lat, lng };
                document.getElementById("location-label").value = result.label || "موقعي";
                updateSavedDisplay(result.label || "موقعي", selectedLocation);
                updateMarkerAndCenter();
                updateLocationInfo();
            } catch (e) {
                console.warn("Unable to load saved location:", e);
                updateSavedDisplay("", null);
            }
        }

        function bindEvents() {
            document.getElementById("use-current-location-btn").addEventListener("click", () => {
                if (!navigator.geolocation) {
                    alert("المتصفح لا يدعم تحديد الموقع");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        selectedLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                        updateMarkerAndCenter();
                        updateLocationInfo();
                    },
                    () => alert("تعذر الحصول على موقعك الحالي"),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });

            document.getElementById("save-location-btn").addEventListener("click", async () => {
                if (!selectedLocation) {
                    alert("اختر موقعًا على الخريطة أولًا");
                    return;
                }

                const label = document.getElementById("location-label").value.trim() || "موقعي";
                const saveBtn = document.getElementById("save-location-btn");

                try {
                    setButtonLoading(saveBtn, "جاري الحفظ...", true);
                    await API.setUserLocation(userEmail, selectedLocation.lat, selectedLocation.lng, label);
                    updateSavedDisplay(label, selectedLocation);
                    alert("تم حفظ موقعك بنجاح");
                } catch (e) {
                    console.error("Save location error:", e);
                    alert("تعذر حفظ الموقع. حاول مرة أخرى.");
                } finally {
                    setButtonLoading(saveBtn, "", false);
                }
            });

            document.getElementById("clear-location-btn").addEventListener("click", async () => {
                if (!confirm("هل تريد حذف موقعك المحفوظ؟")) return;
                const clearBtn = document.getElementById("clear-location-btn");

                try {
                    setButtonLoading(clearBtn, "جاري الحذف...", true);
                    await API.deleteUserLocation(userEmail);
                    selectedLocation = null;
                    if (marker) {
                        marker.setMap(null);
                        marker = null;
                    }
                    map.setCenter(DEFAULT_CENTER);
                    map.setZoom(DEFAULT_ZOOM);
                    document.getElementById("location-label").value = "موقعي";
                    updateLocationInfo();
                    updateSavedDisplay("", null);
                    alert("تم حذف الموقع");
                } catch (e) {
                    console.error("Delete location error:", e);
                    alert("تعذر حذف الموقع. حاول مرة أخرى.");
                } finally {
                    setButtonLoading(clearBtn, "", false);
                }
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const userRaw = localStorage.getItem("antika_user");
            if (!userRaw) {
                window.location.href = "login.html";
                return;
            }

            try {
                const user = JSON.parse(userRaw);
                userEmail = user.email || "";
                if (!userEmail) {
                    window.location.href = "login.html";
                    return;
                }

                await initMap();
                await loadSavedLocation();
                bindEvents();
            } catch (e) {
                console.error("Location page init error:", e);
                showMapError("تعذر تحميل Google Maps. تأكد من إعداد المفتاح وصلاحيات الدومين.");
            } finally {
                document.getElementById("loading").classList.add("hidden");
                document.getElementById("location-manager").classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
