<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - انتيكا استور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'antika-pink': '#FFB6C1',
                        'antika-pink-dark': '#FF69B4',
                        'antika-gold': '#D6C1A6',
                        'antika-gold-dark': '#C4AC8E',
                    },
                    fontFamily: {
                        'tajawal': ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html { overflow-y: scroll; }
        body { font-family: 'Tajawal', sans-serif; }
        
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            color: #4b5563;
            transition: all 0.2s;
            border-radius: 8px;
            margin-bottom: 4px;
        }
        .sidebar-item:hover {
            background-color: #f9fafb;
            color: #D6C1A6;
        }
        .sidebar-item.active {
            background-color: #f3f4f6;
            color: #D6C1A6;
            font-weight: 600;
        }
        .sidebar-item i { width: 20px; text-align: center; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Unified Announcement Bar -->
    <antika-announcement-bar></antika-announcement-bar>

    <!-- Unified Header Component -->
    <antika-header></antika-header>

    <!-- Main Content -->
    <main>
        <!-- Breadcrumb -->
        <nav class="bg-white border-b py-3">
            <div class="container mx-auto px-4">
                <div class="flex items-center text-sm">
                    <a href="index.html" class="text-antika-gold font-semibold">الرئيسية</a>
                    <i class="fas fa-chevron-left mx-2 text-gray-400 text-xs"></i>
                    <a href="account.html" class="text-antika-gold font-semibold">حسابي</a>
                    <i class="fas fa-chevron-left mx-2 text-gray-400 text-xs"></i>
                    <span class="text-gray-600">الإشعارات</span>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="container mx-auto px-4 py-8">
            <div class="flex flex-col lg:flex-row gap-6">
                
                <!-- Sidebar Menu -->
                <aside class="w-full lg:w-64 flex-shrink-0">
                    <div class="bg-white rounded-xl shadow-sm border p-4">
                        <a href="notifications.html" class="sidebar-item active">
                            <i class="fas fa-bell"></i>
                            <span>الإشعارات</span>
                        </a>
                        <a href="orders.html" class="sidebar-item">
                            <i class="fas fa-shopping-bag"></i>
                            <span>الطلبات</span>
                        </a>
                        <a href="wishlist.html" class="sidebar-item">
                            <i class="fas fa-heart"></i>
                            <span>المفضلة</span>
                        </a>
                        <a href="account.html" class="sidebar-item">
                            <i class="fas fa-user-circle"></i>
                            <span>حسابي</span>
                        </a>
                        <a href="addresses.html" class="sidebar-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>عناويني</span>
                        </a>
                        <a href="settings.html" class="sidebar-item">
                            <i class="fas fa-cog"></i>
                            <span>الإعدادات</span>
                        </a>
                        <div class="border-t my-3"></div>
                        <a href="login.html" class="sidebar-item text-red-500 hover:bg-red-50 hover:text-red-600">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>تسجيل الخروج</span>
                        </a>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <div class="flex-1">
                    <div class="bg-white rounded-xl shadow-sm border p-12 text-center min-h-[400px] flex flex-col items-center justify-center">
                        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-6">
                            <i class="fas fa-bell text-4xl text-gray-300"></i>
                        </div>
                        <h2 class="text-xl font-bold text-gray-800 mb-2">لا توجد إشعارات</h2>
                        <p class="text-gray-500">سيتم إعلامك عند وجود أي تحديثات أو عروض جديدة</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <antika-footer></antika-footer>

    <script src="js/header.js"></script>
    <script src="js/auth-sync.js"></script>
    <script src="js/announcement-bar.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
