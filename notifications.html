<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - انتيكا استور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'antika-pink': '#FFB6C1',
                        'antika-pink-dark': '#FF69B4',
                        'antika-gold': '#D6C1A6',
                        'antika-gold-dark': '#C4AC8E',
                    },
                    fontFamily: { 'tajawal': ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        html { overflow-y: scroll; }
        body { font-family: 'Tajawal', sans-serif; }
        .sidebar-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; color: #4b5563; transition: all 0.2s;
            border-radius: 8px; margin-bottom: 4px;
        }
        .sidebar-item:hover { background-color: #f9fafb; color: #D6C1A6; }
        .sidebar-item.active { background-color: #f3f4f6; color: #D6C1A6; font-weight: 600; }
        .sidebar-item i { width: 20px; text-align: center; }
        .notif-card {
            background: white; border-radius: 14px; padding: 18px 20px;
            border: 1px solid #f0e8e0; display: flex; gap: 14px; align-items: flex-start;
            transition: box-shadow 0.2s;
        }
        .notif-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .notif-card.unread { border-right: 4px solid #FF69B4; }
        .notif-icon {
            width: 46px; height: 46px; border-radius: 50%;
            background: #fff0f5; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; font-size: 1.3rem;
        }
    </style>
    <style id="antika-reset">
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <antika-header></antika-header>

    <main>
        <nav class="bg-white border-b py-3">
            <div class="container mx-auto px-4">
                <div class="flex items-center text-sm">
                    <a href="index.html" class="text-antika-gold font-semibold">الرئيسية</a>
                    <i class="fas fa-chevron-left mx-2 text-gray-400 text-xs"></i>
                    <a href="account.html" class="text-antika-gold font-semibold">حسابي</a>
                    <i class="fas fa-chevron-left mx-2 text-gray-400 text-xs"></i>
                    <span class="text-gray-600">الإشعارات</span>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4 py-8">
            <div class="flex flex-col lg:flex-row gap-6">

                <!-- Sidebar -->
                <aside class="w-full lg:w-64 flex-shrink-0">
                    <div class="bg-white rounded-xl shadow-sm border p-4">
                        <a href="notifications.html" class="sidebar-item active">
                            <i class="fas fa-bell"></i><span>الإشعارات</span>
                        </a>
                        <a href="orders.html" class="sidebar-item">
                            <i class="fas fa-shopping-bag"></i><span>الطلبات</span>
                        </a>
                        <a href="wishlist.html" class="sidebar-item">
                            <i class="fas fa-heart"></i><span>المفضلة</span>
                        </a>
                        <a href="account.html" class="sidebar-item">
                            <i class="fas fa-user-circle"></i><span>حسابي</span>
                        </a>
                        <a href="addresses.html" class="sidebar-item">
                            <i class="fas fa-map-marker-alt"></i><span>عناويني</span>
                        </a>
                        <a href="settings.html" class="sidebar-item">
                            <i class="fas fa-cog"></i><span>الإعدادات</span>
                        </a>
                        <div class="border-t my-3"></div>
                        <a href="login.html" class="sidebar-item text-red-500 hover:bg-red-50 hover:text-red-600">
                            <i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span>
                        </a>
                    </div>
                </aside>

                <!-- Main Content -->
                <div class="flex-1">
                    <div class="flex items-center justify-between mb-4">
                        <h1 class="text-xl font-bold text-gray-800">
                            <i class="fas fa-bell text-antika-gold ml-2"></i>الإشعارات
                        </h1>
                        <button id="mark-read-btn" onclick="markAllRead()" class="text-sm text-antika-gold hover:text-antika-gold-dark transition hidden">
                            تحديد الكل كمقروء
                        </button>
                    </div>

                    <div id="notif-container" class="space-y-3">
                        <div class="bg-white rounded-xl shadow-sm border p-12 text-center">
                            <i class="fas fa-spinner fa-spin text-3xl text-gray-300 mb-4 block"></i>
                            <p class="text-gray-400">جاري التحميل...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <antika-footer></antika-footer>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/header.js"></script>
    <script src="js/auth-sync.js"></script>
    <script src="js/announcement-bar.js"></script>
    <script src="js/footer.js"></script>

    <script>
        let currentUserEmail = null;

        async function loadNotifications() {
            const user = (window.Auth && typeof Auth.getCurrentUser === 'function')
                ? Auth.getCurrentUser()
                : (() => { try { return JSON.parse(localStorage.getItem('antika_user') || 'null'); } catch(e) { return null; } })();

            if (!user || !user.email) {
                document.getElementById('notif-container').innerHTML =
                    '<div class="bg-white rounded-xl shadow-sm border p-12 text-center"><i class="fas fa-lock text-4xl text-gray-300 mb-4 block"></i><p class="text-gray-500">يجب تسجيل الدخول لعرض الإشعارات</p><a href="login.html" class="mt-4 inline-block bg-antika-gold text-white px-6 py-2 rounded-lg font-bold">تسجيل الدخول</a></div>';
                return;
            }

            currentUserEmail = user.email;

            try {
                const res = await fetch('/api/notifications?email=' + encodeURIComponent(user.email));
                const data = await res.json();
                const notifications = data.notifications || [];

                // نظهر زر "تحديد الكل كمقروء" لو فيه غير مقروء — بدون تعليمها مقروءة تلقائياً بمجرد فتح الصفحة
                if (notifications.some(n => !n.read)) {
                    document.getElementById('mark-read-btn').classList.remove('hidden');
                } else {
                    document.getElementById('mark-read-btn').classList.add('hidden');
                }

                renderNotifications(notifications);
            } catch(e) {
                document.getElementById('notif-container').innerHTML =
                    '<div class="bg-white rounded-xl p-8 text-center text-red-400">حدث خطأ في تحميل الإشعارات</div>';
            }
        }

        // يتعامل مع Firestore Timestamp (يوصل بعد التحويل لـ JSON كـ {_seconds, _nanoseconds} أو {seconds, nanoseconds})
        // بدل new Date() المباشر اللي يفشل مع هذي الصيغة ويطلع "Invalid Date" — نفس الحل المستخدم بلوحة الأدمن
        function formatNotifDate(value) {
            if (!value) return '';
            let d;
            if (typeof value === 'object' && (value._seconds != null || value.seconds != null)) {
                const secs = value._seconds != null ? value._seconds : value.seconds;
                d = new Date(secs * 1000);
            } else {
                d = new Date(value);
            }
            return isNaN(d.getTime()) ? '' : d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function renderNotifications(notifications) {
            const container = document.getElementById('notif-container');

            if (!notifications.length) {
                container.innerHTML = '<div class="bg-white rounded-xl shadow-sm border p-12 text-center min-h-[300px] flex flex-col items-center justify-center"><div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-5"><i class="fas fa-bell text-3xl text-gray-300"></i></div><h2 class="text-lg font-bold text-gray-700 mb-2">لا توجد إشعارات</h2><p class="text-gray-400 text-sm">ستظهر هنا إشعاراتك الجديدة، مثل تحديثات طلباتك</p></div>';
                return;
            }

            container.innerHTML = notifications.map(function(n) {
                const date = formatNotifDate(n.updatedAt);
                const unreadClass = !n.read ? ' unread' : '';
                const cardClick = ' onclick="markSingleRead(\'' + n.id + '\')"';
                const closeBtn = '<button onclick="event.preventDefault();event.stopPropagation();deleteNotification(\'' + n.id + '\')" class="text-gray-300 hover:text-red-500 transition flex-shrink-0 p-1" title="حذف الإشعار"><i class="fas fa-times"></i></button>';

                // إشعار متعلق بحالة الطلب
                if (n.type === 'order') {
                    return '<div class="notif-card' + unreadClass + ' cursor-pointer" id="notif-' + n.id + '"' + cardClick + '>'
                        + '<div class="notif-icon">📦</div>'
                        + '<div style="flex:1">'
                        + '<p class="font-bold text-gray-800 text-sm mb-1">' + (n.title || 'تحديث على طلبك') + '</p>'
                        + '<p class="text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2 mb-2 leading-relaxed">' + (n.message || '') + '</p>'
                        + '<p class="text-xs text-gray-400"><i class="fas fa-clock ml-1"></i>' + date + '</p>'
                        + '</div>'
                        + (n.orderId ? '<a href="orders.html?order=' + n.orderId + '" class="text-xs text-antika-gold hover:text-antika-gold-dark transition mt-1 flex-shrink-0" title="عرض الطلب"><i class="fas fa-arrow-left"></i></a>' : '')
                        + closeBtn
                        + '</div>';
                }

                // إشعار إعجاب بتعليق (النوع القديم)
                const newCount = n.newLikes || 0;
                const total = n.totalLikes || 0;
                const shortComment = (n.comment || '').length > 60 ? n.comment.substring(0, 60) + '...' : (n.comment || '');

                let msg = '';
                if (total === 1) msg = 'أعجب شخص واحد بتعليقك';
                else if (total === 2) msg = 'أعجب شخصان بتعليقك';
                else msg = 'أعجب ' + total + ' أشخاص بتعليقك';

                return '<div class="notif-card' + unreadClass + ' cursor-pointer" id="notif-' + n.id + '"' + cardClick + '>' 
                    + '<div class="notif-icon">❤️</div>'
                    + '<div style="flex:1">'
                    + '<p class="font-bold text-gray-800 text-sm mb-1">' + msg + '</p>'
                    + (n.productName ? '<p class="text-xs text-antika-gold mb-1"><i class="fas fa-box ml-1"></i>' + n.productName + '</p>' : '')
                    + '<p class="text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2 mb-2 leading-relaxed">&ldquo;' + shortComment + '&rdquo;</p>'
                    + '<p class="text-xs text-gray-400"><i class="fas fa-clock ml-1"></i>' + date + '</p>'
                    + '</div>'
                    + (n.productId ? '<a href="product.html?id=' + n.productId + '" class="text-xs text-antika-gold hover:text-antika-gold-dark transition mt-1 flex-shrink-0" title="عرض المنتج"><i class="fas fa-arrow-left"></i></a>' : '')
                    + closeBtn
                    + '</div>';
            }).join('');
        }

        // تعليم إشعار واحد بعينه كمقروء لما يضغط عليه العميل — ينقص عداد الجرس بمقدار واحد فقط، وباقي الإشعارات تبقى كما هي
        async function markSingleRead(id) {
            const card = document.getElementById('notif-' + id);
            const wasUnread = card && card.classList.contains('unread');
            if (!wasUnread) return; // مقروء أصلاً، ما فيه داعي نطلب من السيرفر شي
            try {
                await fetch('/api/notifications/' + id + '/read', { method: 'PUT' });
                if (card) card.classList.remove('unread');
                // تحديث جرس الهيدر (ينقص بمقدار هذا الإشعار فقط، الباقي غير المقروء يبقى كما هو)
                const header = document.querySelector('antika-header');
                if (header && typeof header.updateNotifCount === 'function' && currentUserEmail) {
                    header.updateNotifCount(currentUserEmail);
                }
                // لو ما بقي أي إشعار غير مقروء، نخفي زر "تحديد الكل كمقروء"
                if (!document.querySelector('.notif-card.unread')) {
                    document.getElementById('mark-read-btn').classList.add('hidden');
                }
            } catch (e) { console.warn('Could not mark notification as read:', e); }
        }

        async function deleteNotification(id) {
            try {
                await fetch('/api/notifications/' + id, { method: 'DELETE' });
                const el = document.getElementById('notif-' + id);
                if (el) el.remove();
                const container = document.getElementById('notif-container');
                if (container && !container.querySelector('.notif-card')) {
                    renderNotifications([]);
                }
                // تحديث الجرس والنقطة الحمراء بالهيدر
                if (window.currentUser || currentUserEmail) {
                    const header = document.querySelector('antika-header');
                    if (header && typeof header.updateNotifCount === 'function') header.updateNotifCount(currentUserEmail);
                }
            } catch (e) { console.warn('Could not delete notification:', e); }
        }

        async function markAllRead(reload = true) {
            if (!currentUserEmail) return;
            try {
                await fetch('/api/notifications/read-all', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentUserEmail })
                });
                document.getElementById('mark-read-btn').classList.add('hidden');
                // تصفير جرس الإشعارات ونقطة الحساب في الهيدر
                const badge = document.getElementById('notif-count');
                if (badge) badge.classList.add('hidden');
                const accountDot = document.getElementById('account-notif-dot');
                if (accountDot) { accountDot.classList.add('hidden'); accountDot.classList.remove('flex'); }
                if (reload) loadNotifications();
            } catch(e) {}
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadNotifications, 300);
        });
    </script>
</body>
</html>
