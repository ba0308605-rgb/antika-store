<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | انتيكا استور</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'antika-pink': '#FFB6C1',
                        'antika-pink-dark': '#FF69B4',
                        'antika-gold': '#D6C1A6',
                        'antika-gold-dark': '#C4AC8E',
                        'antika-gold-light': '#E8D9C5',
                        'antika-beige': '#FAF0E6',
                        'antika-lavender': '#FFF0F5',
                    },
                    fontFamily: {
                        'tajawal': ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Header Styles */
        .main-header {
            background: white;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Logo Styles */
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-image-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #D6C1A6;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-text-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .logo-text-main {
            font-size: 22px;
            font-weight: 800;
            color: #D6C1A6;
            line-height: 1;
        }
        .logo-text-sub {
            font-size: 10px;
            color: #999;
            letter-spacing: 2px;
            text-transform: lowercase;
            margin-top: 2px;
        }
        @media (max-width: 768px) {
            .logo-image-container { width: 40px; height: 40px; }
            .logo-text-main { font-size: 18px; }
            .logo-text-sub { font-size: 8px; }
        }

        /* Hamburger Menu */
        .hamburger-lines {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 10px;
        }
        .hamburger-lines span {
            width: 25px;
            height: 2px;
            background: #333;
            transition: all 0.3s ease;
        }

        /* Mobile Menu */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            max-width: 350px;
            height: 100vh;
            background: white;
            z-index: 1000;
            transition: right 0.3s ease;
            box-shadow: -5px 0 30px rgba(0,0,0,0.2);
        }
        .mobile-menu.open {
            right: 0;
        }
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- Login Content -->
    <div class="container mx-auto px-4 py-12 flex-1">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div class="text-center mb-8">
                    <div class="logo-wrapper justify-center mb-4">
                        <div class="logo-image-container">
                            <img src="images/logo.jpg" alt="انتيكا استور" class="logo-image">
                        </div>
                    </div>
                    <h2 class="text-2xl font-bold text-antika-gold">تسجيل الدخول</h2>
                    <p class="text-gray-500 mt-2">أهلاً بك في انتيكا استور</p>
                </div>

                <!-- Tabs -->
                <div class="flex mb-6 border-b border-gray-200">
                    <button onclick="showTab('login')" id="tab-login" class="flex-1 py-3 text-center font-bold text-antika-gold border-b-2 border-antika-gold">
                        تسجيل الدخول
                    </button>
                    <a href="register.html" id="tab-register" class="flex-1 py-3 text-center font-bold text-gray-400 border-b-2 border-transparent hover:text-antika-gold transition">
                        إنشاء حساب
                    </a>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">البريد الإلكتروني</label>
                        <input type="email" id="login-email" required 
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none transition"
                               placeholder="example@email.com">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">كلمة المرور</label>
                        <div class="relative">
                            <input type="password" id="login-password" required 
                                   class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none transition pr-12"
                                   placeholder="••••••••">
                            <button type="button" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-antika-pink transition"
                                    onclick="togglePasswordVisibility('login-password')">
                                <i class="fas fa-eye" id="login-password-icon"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" 
                            class="w-full bg-antika-gold text-white py-3 rounded-lg font-bold hover:bg-antika-gold-dark transition">
                        تسجيل الدخول
                    </button>
                </form>

                <!-- Google Login -->
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">أو</span>
                        </div>
                    </div>
                    <button onclick="googleLogin()" 
                            class="w-full mt-4 flex items-center justify-center gap-3 border-2 border-gray-200 rounded-lg px-4 py-3 hover:bg-gray-50 transition">
                        <img src="https://www.google.com/favicon.ico" alt="Google" class="w-5 h-5">
                        <span class="font-bold text-gray-700">تسجيل الدخول بـ Google</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        // Toggle Mobile Menu
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('open');
            document.getElementById('menu-overlay').classList.toggle('open');
        }

        // Tab switching
        // Toggle password visibility
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(fieldId + '-icon');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Login Form Submit
        document.getElementById('login-form')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const result = await Auth.userLogin(email, password);
                if (result.success) {
                    showNotification('تم تسجيل الدخول بنجاح! 🎉');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showNotification(result.error, 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showNotification('حدث خطأ أثناء تسجيل الدخول', 'error');
            }
        });

        // Google Login
        async function googleLogin() {
            try {
                const result = await Auth.googleLogin();
                if (result.success) {
                    showNotification('تم تسجيل الدخول بنجاح! 🎉');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showNotification(result.error, 'error');
                }
            } catch (error) {
                console.error('Google login error:', error);
                showNotification('حدث خطأ أثناء تسجيل الدخول بـ Google', 'error');
            }
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.className = `fixed top-24 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-full shadow-2xl font-bold ${type === 'success' ? 'bg-antika-pink text-white' : 'bg-red-500 text-white'}`;
            notification.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} ml-2"></i> ${message}`;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Load announcing text
        async function loadAnnouncingText() {
            try {
                const text = await API.getAnnouncingText();
                const contents = document.querySelectorAll('.announcing-content');
                contents.forEach(el => el.textContent = text);
            } catch (error) {
                console.error('Error loading announcing text:', error);
            }
        }

        // Load categories for mobile menu
        async function loadCategories() {
            try {
                const categories = await API.getCategories();
                const container = document.getElementById('mobile-categories');
                if (container && categories.length > 0) {
                    container.innerHTML = categories.map(cat => `
                        <a href="products.html?category=${cat.id}" class="flex items-center gap-3 py-2 text-gray-700 hover:text-antika-pink transition" onclick="toggleMenu()">
                            <span class="text-xl">${cat.icon || '📦'}</span>
                            <span>${cat.name}</span>
                        </a>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            loadAnnouncingText();
            await loadCategories();
            updateCartCount();
        });

        // Update cart count
        async function updateCartCount() {
            try {
                const cart = await API.getCart();
                const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
                const badge = document.getElementById('cart-count');
                if (badge) {
                    badge.textContent = count;
                    badge.classList.toggle('hidden', count === 0);
                }
            } catch (error) {
                console.error('Error updating cart count:', error);
            }
        }
    </script>

</body>
</html>
