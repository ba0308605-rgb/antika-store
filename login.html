    <script src="https://cdn.tailwindcss.com">
        // Search Modal Functions
        function openSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                document.getElementById('search-modal-input').focus();
            }, 100);
        }

        function closeSearchModal(event) {
            if (event && event.target !== event.currentTarget && event.target.closest('.search-modal-box')) {
                return;
            }
            const modal = document.getElementById('search-modal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleModalSearch(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        function performSearch() {
            const query = document.getElementById('search-modal-input').value.trim();
            if (query) {
                window.location.href = `products.html?search=${encodeURIComponent(query)}`;
            }
        }

    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'antika-pink': '#FFB6C1',

                        'antika-lavender': '#FFF0F5',
                    },

        // Search Modal Functions
        function openSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {

    <style>
        body { font-family: 'Tajawal', sans-serif; }

        .breadcrumb {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.1), rgba(214, 193, 166, 0.1));
            border-bottom: 1px solid rgba(255, 182, 193, 0.2);
        }
        .breadcrumb-item:not(:last-child)::after {
            content: '›';
            margin: 0 8px;
            color: #D6C1A6;
            font-size: 1.2em;
        }
    /* Search Modal Styles */
        .search-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 100px;
        }
        .search-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .search-modal-box {
            background: white;
            border-radius: 50px;
            padding: 8px 24px;
            width: 90%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }
        .search-modal-overlay.active .search-modal-box {
            transform: translateY(0);
        }
        .search-modal-box input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            padding: 12px 0;
            color: #333;
        }
        .search-modal-box input::placeholder {
            color: #999;
        }
        .search-modal-box button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #D6C1A6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .search-modal-box button:hover {
            background: #C4AC8E;
        }
        .search-modal-close {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            color: #333;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
        }
        .search-modal-close:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-antika-lavender via-antika-beige to-antika-gold-light min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-2">
                    <img src="images/logo.jpg" alt="انتيكا استور" class="w-12 h-12 rounded-full">
                    <div>
                        <h1 class="text-2xl font-bold text-antika-gold">انتيكا استور</h1>
                    </div>
                </a>
                <a href="index.html" class="text-gray-600 hover:text-antika-pink-dark transition">
                    <i class="fas fa-arrow-right ml-1"></i> العودة للمتجر
                </a>
            </div>
        </div>
    </header>

    <!-- Breadcrumb -->
    <nav class="breadcrumb py-3">
        <div class="container mx-auto px-4">
            <div class="flex items-center text-sm">
                <a href="index.html" class="breadcrumb-item text-antika-gold hover:text-antika-pink-dark transition font-semibold">
                    <i class="fas fa-home ml-1"></i> الرئيسية
                </a>
                <span class="text-gray-500">تسجيل الدخول</span>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md mx-auto px-4 py-12">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block">
                <img src="images/logo.jpg" alt="انتيكا استور" class="w-20 h-20 rounded-full mx-auto mb-4">
                <h1 class="text-3xl font-bold text-antika-gold mt-2">انتيكا استور</h1>
                <p class="text-gray-500 text-sm">أناقة منزلية بأسلوب عصري</p>
            </a>
        </div>

        <!-- Login Form -->
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-center text-antika-gold mb-2">تسجيل الدخول</h2>
            <p class="text-gray-500 text-center mb-8 text-sm">أهلاً بعودتك! سجل دخولك للمتابعة</p>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-semibold mb-2 text-sm">البريد الإلكتروني</label>
                    <div class="relative">
                        <input type="email" id="login-email" placeholder="your@email.com" 
                               class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3 pr-12 focus:border-antika-gold focus:outline-none transition text-left">
                        <i class="fas fa-envelope absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 font-semibold mb-2 text-sm">كلمة المرور</label>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="••••••••" 
                               class="w-full bg-gray-50 border-2 border-gray-200 rounded-xl px-4 py-3 pr-12 focus:border-antika-gold focus:outline-none transition">
                        <i class="fas fa-lock absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <button type="button" onclick="togglePassword()" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-antika-gold transition">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex justify-between items-center text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">

                    </label>
                    <a href="#" class="text-antika-gold hover:underline">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="w-full bg-antika-gold text-white py-4 rounded-xl font-bold text-lg hover:bg-antika-gold-dark transition transform hover:scale-[1.02] shadow-lg">
                    تسجيل الدخول
                </button>
            </form>

            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="text-gray-400 text-sm">أو</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center gap-2 bg-white border-2 border-gray-200 py-3 rounded-xl hover:border-antika-gold transition">

                    <span class="text-sm font-semibold text-gray-600">Google</span>
                </button>
                <button class="flex items-center justify-center gap-2 bg-white border-2 border-gray-200 py-3 rounded-xl hover:border-antika-gold transition">

                </button>

            <p class="text-center mt-6 text-gray-600">

        </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('login-password');
            const eyeIcon = document.getElementById('eye-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function showRegister() {
            alert('سيتم فتح صفحة التسجيل قريباً!');
        }

        // Admin credentials - Use strong password
        const ADMIN_CREDENTIALS = {
            email: 'BDR-FIRST',
            password: 'B1-a2d3e4r5'
        };

        // Track login attempts for security
        let loginAttempts = parseInt(sessionStorage.getItem('loginAttempts') || '0');
        const MAX_ATTEMPTS = 5;
        const LOCKOUT_TIME = 15 * 60 * 1000; // 15 minutes

        function isLockedOut() {
            const lockoutEnd = sessionStorage.getItem('lockoutEnd');
            if (lockoutEnd && new Date().getTime() < parseInt(lockoutEnd)) {
                return true;
            }
            return false;
        }

        function lockAccount() {
            const lockoutEnd = new Date().getTime() + LOCKOUT_TIME;
            sessionStorage.setItem('lockoutEnd', lockoutEnd.toString());
            alert('تم قفل الحساب مؤقتاً لأسباب أمنية. الرجاء المحاولة بعد 15 دقيقة.');
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Check if account is locked
            if (isLockedOut()) {
                alert('الحساب مقفل مؤقتاً. الرجاء المحاولة لاحقاً.');
                return;
            }
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            // Admin login with secure credentials
            if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
                // Reset login attempts on success
                sessionStorage.removeItem('loginAttempts');
                sessionStorage.removeItem('lockoutEnd');
                
                // Generate secure token
                const token = 'admin_' + btoa(Date.now() + '_' + Math.random().toString(36).substr(2, 9));
                localStorage.setItem('antika_token', token);
                localStorage.setItem('antika_user', JSON.stringify({ 
                    name: 'المسؤول', 
                    email: email, 
                    isAdmin: true,
                    loginTime: new Date().toISOString()
                }));
                window.location.href = 'admin.html';
            } else if (email && password) {
                // Regular user login
                localStorage.setItem('antika_user', JSON.stringify({ 
                    name: email.split('@')[0], 
                    email: email 
                }));
                alert('تم تسجيل الدخول بنجاح! 🎉');
                window.location.href = 'index.html';
            } else {
                // Failed login attempt
                loginAttempts++;
                sessionStorage.setItem('loginAttempts', loginAttempts.toString());
                
                if (loginAttempts >= MAX_ATTEMPTS) {
                    lockAccount();
                } else {
                    alert(`بيانات الدخول غير صحيحة! محاولات متبقية: ${MAX_ATTEMPTS - loginAttempts}`);
                }
            }
        });
    
        // Search Modal Functions
        function openSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                document.getElementById('search-modal-input').focus();
            }, 100);
        }

        function closeSearchModal(event) {
            if (event && event.target !== event.currentTarget && event.target.closest('.search-modal-box')) {
                return;
            }
            const modal = document.getElementById('search-modal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleModalSearch(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        function performSearch() {
            const query = document.getElementById('search-modal-input').value.trim();
            if (query) {
                window.location.href = `products.html?search=${encodeURIComponent(query)}`;
            }
        }

    </script>
