<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة التسوق | انتيكا استور</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet Map (for embedded location picker) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'antika-pink': '#FFB6C1',
                        'antika-pink-dark': '#FF69B4',
                        'antika-gold': '#D6C1A6',
                        'antika-gold-dark': '#C4AC8E',
                        'antika-gold-light': '#E8D9C5',
                        'antika-beige': '#FAF0E6',
                        'antika-lavender': '#FFF0F5',
                    },
                    fontFamily: {
                        'tajawal': ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Tajawal', sans-serif; }

        /* Header Styles */
        .main-header {
            background: white;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Logo Styles */
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-image-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #D6C1A6;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        .logo-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .logo-text-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .logo-text-main {
            font-size: 22px;
            font-weight: 800;
            color: #D6C1A6;
            line-height: 1;
        }
        .logo-text-sub {
            font-size: 10px;
            color: #999;
            letter-spacing: 2px;
            text-transform: lowercase;
            margin-top: 2px;
        }
        @media (max-width: 768px) {
            .logo-image-container { width: 40px; height: 40px; }
            .logo-text-main { font-size: 18px; }
            .logo-text-sub { font-size: 8px; }
        }

        /* Hamburger Menu */
        .hamburger-lines {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 10px;
        }
        .hamburger-lines span {
            width: 25px;
            height: 2px;
            background: #333;
            transition: all 0.3s ease;
        }

        /* Mobile Menu */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 80%;
            max-width: 350px;
            height: 100vh;
            background: white;
            z-index: 1000;
            transition: right 0.3s ease;
            box-shadow: -5px 0 30px rgba(0,0,0,0.2);
        }
        .mobile-menu.open {
            right: 0;
        }
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* Breadcrumb */
        .breadcrumb {
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.1), rgba(214, 193, 166, 0.1));
            border-bottom: 1px solid rgba(255, 182, 193, 0.2);
        }
        .breadcrumb-item:not(:last-child)::after {
            content: '›';
            margin: 0 8px;
            color: #D6C1A6;
            font-size: 1.2em;
        }

        /* Search Modal */
        .search-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 100px;
        }
        .search-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .search-modal-box {
            background: white;
            border-radius: 50px;
            padding: 8px 24px;
            width: 90%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }
        .search-modal-overlay.active .search-modal-box {
            transform: translateY(0);
        }
        .search-modal-box input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            padding: 12px 0;
            color: #333;
        }
        .search-modal-box button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #D6C1A6;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .search-modal-close {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            color: #333;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <!-- Unified Header Component -->

    <!-- Main Content Wrapper -->

    <!-- Breadcrumb -->
    <nav class="breadcrumb py-3">
        <div class="container mx-auto px-4">
            <div class="flex items-center text-sm">
                <a href="index.html" class="breadcrumb-item text-antika-gold hover:text-antika-pink-dark transition font-semibold">

                </a>
                <span class="text-gray-500">سلة التسوق</span>

    <!-- Cart Content -->
    <div class="container mx-auto px-4 py-8">
        <h2 class="text-3xl font-bold text-antika-gold mb-8">🛒 سلة التسوق</h2>

        <div id="cart-content" class="grid md:grid-cols-3 gap-8">
            <!-- Cart loaded by JS -->
            <div class="md:col-span-3 text-center py-16 bg-white rounded-2xl shadow-lg">
                <div class="text-6xl mb-4">⏳</div>
                <h3 class="text-2xl font-bold text-gray-400 mb-4">جاري تحميل السلة...</h3>
                <p class="text-gray-500">يرجى الانتظار</p>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold text-antika-gold">إتمام الطلب</h3>
                <button onclick="closeCheckoutModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <form id="checkout-form" class="p-6 space-y-4">
                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">الاسم الكامل:</label>
                        <input id="customer-name" type="text" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none" placeholder="الاسم الكامل" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">رقم الجوال:</label>
                        <input id="customer-phone" type="tel" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none" placeholder="05xxxxxxxx" required>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">البريد الإلكتروني:</label>
                        <input id="customer-email" type="email" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none" placeholder="example@email.com">
                    </div>
                </div>

                <!-- Address Selection: Saved or Custom -->
                <div>
                    <label class="block text-gray-700 font-bold mb-3">📍 اختر عنوانك:</label>
                    
                    <!-- Tabs for address choice -->
                    <div class="flex gap-2 mb-3">
                        <button type="button" class="address-tab flex-1 py-2 px-3 rounded-lg border-2 border-gray-200 font-bold text-sm transition active" data-tab="saved">
                            <i class="fas fa-bookmark ml-1"></i> العناوين المحفوظة
                        </button>
                        <button type="button" class="address-tab flex-1 py-2 px-3 rounded-lg border-2 border-gray-200 font-bold text-sm transition" data-tab="custom">
                            <i class="fas fa-map ml-1"></i> عنوان مخصص
                        </button>
                    </div>

                    <!-- Saved Addresses Tab -->
                    <div id="address-saved-tab" class="address-tab-content space-y-2">
                        <div id="saved-addresses-row" class="hidden">
                            <label class="block text-xs text-gray-500 mb-2">العناوين المتاحة:</label>
                            <select id="saved-addresses-select" class="w-full border-2 border-gray-200 rounded-lg px-3 py-2 text-sm focus:border-antika-gold focus:outline-none"></select>
                        </div>
                        <div id="no-saved-addresses" class="text-center py-4 text-gray-500">
                            <p class="text-sm">لا توجد عناوين محفوظة</p>
                            <a href="addresses.html" target="_blank" class="text-antika-gold text-xs hover:underline">أضف عنوانك</a>
                        </div>
                        <div id="saved-addresses-list" class="hidden space-y-2">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Custom Address Tab -->
                    <div id="address-custom-tab" class="address-tab-content hidden space-y-3">
                        <button type="button" id="open-checkout-map-btn" class="w-full py-3 px-4 text-white rounded-lg font-bold hover:opacity-90 transition text-lg" style="background-color: #D6C1A6;">

                        <div id="checkout-map-container" style="display: none; border: 2px solid #E8B7B7; border-radius: 12px; padding: 12px;">

                        </div>
                        <textarea id="customer-address" rows="2" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none" placeholder="سيتم ملؤها تلقائياً من الخريطة أو أدخل يدوياً"></textarea>

                    <!-- Selected Address Display -->
                    <div id="address-selected-display" class="hidden mt-3 p-3 bg-green-50 border-2 border-green-500 rounded-lg">

                        <p class="text-xs text-gray-600 mt-1"><span id="selected-address-text"></span></p>
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">طريقة الدفع:</label>
                    <select id="payment-method" class="w-full border-2 border-gray-200 rounded-lg px-4 py-3 focus:border-antika-pink focus:outline-none">
                        <option value="cash">الدفع عند الاستلام</option>
                    </select>
                </div>
                <div class="border-t pt-4 mt-4">
                    <div class="flex justify-between text-lg font-bold text-antika-gold">
                        <span>الإجمالي:</span>
                        <span id="checkout-total">0 ر.س</span>
                    </div>
                </div>
                <button type="submit" class="w-full bg-antika-pink text-white py-4 rounded-xl font-bold hover:bg-antika-pink-dark transition text-lg">

    <antika-footer></antika-footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        let cartTotal = 0;

        // Toggle Mobile Menu
        function toggleMenu() {
            document.getElementById('mobile-menu').classList.toggle('open');
            document.getElementById('menu-overlay').classList.toggle('open');
        }

        // Search Modal Functions
        function openSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.classList.add('active');
            document.getElementById('search-modal-input').focus();
            document.body.style.overflow = 'hidden';
        }

        function closeSearchModal() {
            const modal = document.getElementById('search-modal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function handleSearchModal(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        function performSearch() {
            const query = document.getElementById('search-modal-input').value.trim();
            if (query) {
                window.location.href = `products.html?search=${encodeURIComponent(query)}`;
            }
        }

        // Close search modal on backdrop click
        document.getElementById('search-modal')?.addEventListener('click', function(e) {
            if (e.target === this) {
                closeSearchModal();
            }
        });

        // âœ… Show login required modal for checkout
        function showLoginRequiredForCheckout() {
            document.body.innerHTML = `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl w-full max-w-md p-8 text-center">
                        <div class="mb-6">
                            <i class="fas fa-lock-open text-6xl text-antika-gold mb-4"></i>
                            <h3 class="text-2xl font-bold text-gray-800 mb-2">يجب تسجيل الدخول للشراء</h3>
                            <p class="text-gray-600">سجّل دخولك أو أنشئ حساباً لإتمام عملية الشراء</p>
                        </div>
                        <div class="space-y-3">
                            <button onclick="window.location.href='register.html'" class="w-full bg-antika-gold text-white font-bold py-3 rounded-lg hover:bg-antika-gold-dark transition">
                                📝 إنشاء حساب جديد
                            </button>
                            <button onclick="window.location.href='login.html'" class="w-full border-2 border-antika-gold text-antika-gold font-bold py-3 rounded-lg hover:bg-antika-beige transition">
                                🔐 تسجيل الدخول
                            </button>
                            <button onclick="window.location.href='index.html'" class="w-full text-gray-600 py-2 hover:bg-gray-100 rounded-lg">← العودة للصفحة الرئيسية</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Load categories for mobile menu
        async function loadCategories() {
            try {
                const categories = await API.getCategories();
                const container = document.getElementById('mobile-categories');
                if (container && categories.length > 0) {
                    container.innerHTML = categories.map(cat => `
                        <a href="products.html?category=${cat.id}" class="flex items-center gap-3 py-2 text-gray-700 hover:text-antika-pink transition" onclick="toggleMenu()">
                            <span class="text-xl">${cat.icon || '📦'}</span>
                            <span>${cat.name}</span>
                        </a>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading categories:', error);
            }
        }
        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            // Check if user is logged in
            const user = localStorage.getItem('antika_user');
            if (!user) {
                // Show login required modal
                showLoginRequiredForCheckout();
                return;
            }
            
            await loadAnnouncingText();
            await loadCategories();
            await loadCart();
            await updateCartCount();
            checkLoginStatus();
            setupLocationSelector();
            setupAddressSelector();
            await loadSavedAddressesForAddressSelection();
        });

        // Load announcing text
        async function loadAnnouncingText() {
            try {
                const text = await API.getAnnouncingText();
                const contents = document.querySelectorAll('.announcing-content');
                contents.forEach(el => el.textContent = text);
            } catch (error) {
                console.error('Error loading announcing text:', error);
            }
        }

        // Load Saved Addresses for Checkout
        async function loadSavedAddressesForCheckout() {
            try {
                let user = {};
                try { user = JSON.parse(localStorage.getItem('antika_user') || '{}'); } catch(e){ user = {}; }

                // Try to fetch from server if logged in
                if (user.email) {
                    try {
                        const serverUser = await API.getUser(user.email);
                        if (serverUser && Object.keys(serverUser).length > 0) {
                            user = Object.assign({}, serverUser);
                            localStorage.setItem('antika_user', JSON.stringify(user));
                        }
                    } catch (e) {
                        console.warn('Could not sync addresses from server', e);
                    }
                }

                const locations = user.locations || [];
                const addresses = user.addresses || [];
                const combined = [];
                
                locations.forEach((l, i) => combined.push(Object.assign({ _type: 'location', _idx: i }, l)));
                addresses.forEach((a, i) => combined.push(Object.assign({ _type: 'address', _idx: i }, a)));

                const container = document.getElementById('cart-saved-list');
                const empty = document.getElementById('cart-empty-saved');

                if (!combined || combined.length === 0) {
                    if (empty) empty.classList.remove('hidden');
                    if (container) container.innerHTML = '';
                    return;
                }

                if (empty) empty.classList.add('hidden');
                if (container) {
                    container.innerHTML = combined.map(item => {
                        const label = item.label || (item._type === 'location' ? `الموقع ${item._idx+1}` : `العنوان ${item._idx+1}`);
                        const details = item.address || (item.lat && item.lng ? `${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}` : 'لا توجد تفاصيل');
                        const isDefault = item.isDefault ? '✓ افتراضي' : '';
                        const icon = item._type === 'location' ? '<i class="fas fa-location-dot text-antika-pink"></i>' : '<i class="fas fa-map text-antika-gold"></i>';
                        
                        return `
                            <div class="p-3 bg-white border border-gray-200 rounded-lg flex items-start justify-between gap-2 hover:border-antika-gold transition">
                                <div class="flex-1">
                                    <div class="font-bold text-sm text-gray-900 flex items-center gap-2">${icon} ${label}</div>
                                    <div class="text-xs text-gray-600 mt-1">${details}</div>
                                    ${isDefault ? `<div class="text-xs text-green-600 mt-1 font-bold">${isDefault}</div>` : ''}
                                </div>
                                <button type="button" class="text-antika-teal hover:text-antika-teal-dark font-bold text-sm px-3 py-1 border border-antika-teal rounded hover:bg-antika-teal hover:text-white transition" onclick="selectAddressForCheckout('${item._type}', ${item._idx}, '${label}', '${details}')">
                                    اختر
                                </button>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Error loading saved addresses:', error);
            }
        }

        // Select Address for Checkout
        function selectAddressForCheckout(type, idx, label, details) {
            const addressInput = document.getElementById('customer-address');
            if (addressInput) {
                addressInput.value = label + '\n' + details;
            }
            alert(`✓ تم اختيار: ${label}`);
        }

        // Load announcing text
        async function loadAnnouncingText() {
            try {
                const text = await API.getAnnouncingText();
                const contents = document.querySelectorAll('.announcing-content');
                contents.forEach(el => el.textContent = text);
            } catch (error) {
                console.error('Error loading announcing text:', error);
            }
        }

        // Load cart
        async function loadCart() {
            try {
                console.log('ًں“‚ Loading cart...');
                const cart = await API.getCart();
                console.log('ًں›’ Cart data:', cart);
                const container = document.getElementById('cart-content');

                if (!cart || cart.length === 0) {
                    container.innerHTML = `
                        <div class="md:col-span-3 text-center py-16 bg-white rounded-2xl shadow-lg">
                            <div class="text-6xl mb-4">ًں›’</div>
                            <h3 class="text-2xl font-bold text-gray-400 mb-4">السلة فارغة</h3>
                            <p class="text-gray-500 mb-6">لا توجد منتجات في سلتك حالياً</p>
                            <a href="products.html" class="inline-block bg-antika-gold text-white px-8 py-3 rounded-full font-bold hover:bg-antika-gold-dark transition">
                                اذهب إلى التسوق
                            </a>
                        </div>
                    `;
                    return;
                }

                cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

                container.innerHTML = `
                    <div class="md:col-span-2 space-y-4">
                        ${cart.map(item => `
                            <div class="bg-white rounded-2xl shadow-lg p-4 md:p-6 flex flex-col md:flex-row gap-4 items-center">
                                <a href="product.html?id=${encodeURIComponent(item.productId)}" class="block" title="عرض المنتج">
                                    <img src="${item.image || 'https://via.placeholder.com/800x800/D6C1A6/FFFFFF?text=Antika+Store'}" class="w-24 h-24 rounded-lg object-cover">
                                </a>
                                <div class="flex-1 text-center md:text-right">
                                    <h3 class="font-bold text-lg text-gray-800">
                                        <a href="product.html?id=${encodeURIComponent(item.productId)}" class="hover:text-antika-pink transition-colors">
                                            ${item.name}
                                        </a>
                                    </h3>
                                    <p class="text-antika-pink-dark font-bold text-xl">${item.price} ر.س</p>

        // Update quantity
        async function updateQuantity(productId, quantity) {
            if (quantity < 1) {
                await removeItem(productId);
                return;
            }
            try {
                await API.updateCartItem(productId, quantity);
                await loadCart();
                await updateCartCount();
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }

        // Remove item
        async function removeItem(productId) {
            try {
                await API.removeFromCart(productId);
                await loadCart();
                await updateCartCount();
            } catch (error) {
                console.error('Error removing item:', error);
            }
        }

        // Update cart count
        async function updateCartCount() {
            try {
                const cart = await API.getCart();
                const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
                const badge = document.getElementById('cart-count');
                if (badge) {
                    badge.textContent = count;
                    badge.classList.toggle('hidden', count === 0);
                }
            } catch (error) {
                console.error('Error updating cart count:', error);
            }
        }

        // Checkout Modal
        async function openCheckoutModal() {
            document.getElementById('checkout-total').textContent = cartTotal + ' ر.س';
            // Autofill from account if available
            try {
                const userRaw = localStorage.getItem('antika_user');
                if (userRaw) {
                    const localUser = JSON.parse(userRaw);
                    // Fill basic fields from local copy first
                    const nameInput = document.getElementById('customer-name');
                    const phoneInput = document.getElementById('customer-phone');
                    const emailInput = document.getElementById('customer-email');
                    if (nameInput) nameInput.value = localUser.name || '';
                    if (phoneInput) phoneInput.value = localUser.phone || localUser.mobile || '';
                    if (emailInput) emailInput.value = localUser.email || '';

                    // If we have an email, try to fetch server-synced user (preferred)
                    if (localUser.email) {
                        try {
                            const serverUser = await API.getUser(localUser.email);
                            const usedUser = (serverUser && Object.keys(serverUser).length > 0) ? serverUser : localUser;
                            // update localStorage with server copy for consistency
                            localStorage.setItem('antika_user', JSON.stringify(usedUser));

                            const savedRow = document.getElementById('saved-addresses-row');
                            const select = document.getElementById('saved-addresses-select');
                            if (usedUser.addresses && Array.isArray(usedUser.addresses) && usedUser.addresses.length > 0) {
                                select.innerHTML = usedUser.addresses.map((a, idx) => `<option value="${idx}">${a.label || a.address || ('العنوان ' + (idx+1))}</option>`).join('');
                                savedRow.classList.remove('hidden');
                                // Prefer default address if set
                                const defaultAddrIndex = usedUser.addresses.findIndex(a => a.isDefault === true);
                                const chosenIdx = defaultAddrIndex !== -1 ? defaultAddrIndex : 0;
                                select.value = String(chosenIdx);
                                const first = usedUser.addresses[chosenIdx];
                                document.getElementById('customer-address').value = first.address || '';
                                if (first.location) {
                                    updateLocationDisplay(first.location);
                                    localStorage.setItem('selectedLocation', JSON.stringify(first.location));
                                }
                            } else {
                                savedRow.classList.add('hidden');
                                select.innerHTML = '';
                            }
                        } catch (e) {
                            console.error('Error fetching user from server, falling back to local:', e);
                        }
                    }
                }
            } catch (e) {
                console.error('Error autofilling checkout from account:', e);
            }

            document.getElementById('checkout-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            await loadSavedAddressesForAddressSelection();
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Checkout Form Submit
        document.getElementById('checkout-form')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                const cart = await API.getCart();
                if (cart.length === 0) {
                    alert('السلة فارغة!');
                    return;
                }

                const customerName = (document.getElementById('customer-name')?.value || '').trim();
                const customerPhone = (document.getElementById('customer-phone')?.value || '').trim();
                const customerEmail = (document.getElementById('customer-email')?.value || '').trim();
                const customerAddress = (document.getElementById('customer-address')?.value || '').trim();

                if (!customerName || !customerPhone || !customerAddress) {
                    alert('يرجى تعبئة الاسم ورقم الجوال والعنوان قبل إتمام الطلب.');
                    return;
                }

                // Get location from localStorage (if selected)
                const storedLocation = localStorage.getItem('selectedLocation');
                const location = storedLocation ? JSON.parse(storedLocation) : null;

                const orderData = {
                    customerName,
                    customerPhone,
                    customerEmail,
                    customerAddress,
                    paymentMethod: document.getElementById('payment-method').value,
                    // Add location if available
                    location: location ? {
                        type: 'Point',
                        coordinates: [location.lng, location.lat] // GeoJSON format: [longitude, latitude]
                    } : undefined,
                    items: cart.map(item => ({
                        productId: item.productId,
                        name: item.name,
                        price: item.price,
                        image: item.image,
                        quantity: item.quantity
                    })),
                    total: cartTotal,
                    status: 'processing'
                };

                // Remove undefined location field if not set
                if (!orderData.location) {
                    delete orderData.location;
                }

                await API.createOrder(orderData);
                try {
                    const localOrders = JSON.parse(localStorage.getItem('antika_orders') || '[]');
                    localOrders.unshift({ id: 'local_' + Date.now(), date: new Date().toISOString(), ...orderData });
                    localStorage.setItem('antika_orders', JSON.stringify(localOrders));
                } catch (e) {
                    console.warn('Could not persist local order history:', e);
                }

                try {
                    if (window.Auth && typeof Auth.addOrder === 'function') {
                        await Auth.addOrder(orderData);
                    }
                } catch (e) {
                    console.warn('Could not sync order to Auth:', e);
                }

                await API.clearCart();
                
                // Clear stored location
                localStorage.removeItem('selectedLocation');
                
                closeCheckoutModal();
                alert('🎉 تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');
                await loadCart();
                await updateCartCount();
                
            } catch (error) {
                console.error('Error during checkout:', error);
                alert('حدث خطأ أثناء إتمام الطلب. حاول مرة أخرى.');
            }
        });

        // Initialize Map in Checkout
        let checkoutMap = null;
        let checkoutMarker = null;

        function initCheckoutMap() {
            if (checkoutMap) return; // Map already initialized

            const mapContainer = document.getElementById('checkout-map');
            const defaultLat = 24.7136;
            const defaultLng = 46.6753;

            try {
                checkoutMap = L.map(mapContainer).setView([defaultLat, defaultLng], 13);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(checkoutMap);

                checkoutMarker = L.marker([defaultLat, defaultLng], {
                    draggable: true
                }).addTo(checkoutMap);

                // Update coordinates when marker is dragged
                checkoutMarker.on('dragend', () => {
                    const latlng = checkoutMarker.getLatLng();
                    updateCheckoutLocation(latlng.lat, latlng.lng);
                });

                // Click on map to place marker
                checkoutMap.on('click', (e) => {
                    checkoutMarker.setLatLng(e.latlng);
                    updateCheckoutLocation(e.latlng.lat, e.latlng.lng);
                });

            } catch (error) {
                console.error('Error initializing checkout map:', error);
            }
        }

        function updateCheckoutLocation(lat, lng) {
            document.getElementById('checkout-coords').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            document.getElementById('checkout-location-info').classList.remove('hidden');
            
            // Update address field with coordinates
            const addressInput = document.getElementById('customer-address');
            if (addressInput) {
                addressInput.value = `الموقع: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            }
        }

        // Search locations in checkout map

            const searchInput = document.getElementById('checkout-map-search');

            if (!searchInput) return;

            searchInput.addEventListener('input', async (e) => {
                const query = e.target.value.trim();
                if (query.length < 3) {
                    resultsContainer.classList.add('hidden');
                    return;
                }

                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8`);
                    const results = await response.json();
                    
                    if (results.length === 0) {
                        resultsContainer.innerHTML = '<p class="text-xs text-gray-500 p-2">لم يتم العثور على نتائج</p>';
                        resultsContainer.classList.remove('hidden');
                        return;
                    }

                    resultsContainer.innerHTML = results.map(result => `
                        <button type="button" class="w-full text-right p-2 hover:bg-gray-100 rounded text-xs border-b border-gray-100 transition" onclick="selectCheckoutMapResult('${result.lat}', '${result.lon}', '${result.name.replace(/'/g, "\\'")}')">
                            <div class="font-bold text-gray-900">${result.name}</div>
                            <div class="text-gray-600 text-xs">${result.display_name.substring(0, 50)}...</div>
                        </button>
                    `).join('');
                    resultsContainer.classList.remove('hidden');
                } catch (error) {
                    console.error('Search error:', error);
                    resultsContainer.innerHTML = '<p class="text-xs text-red-500 p-2">خطأ في البحث</p>';
                    resultsContainer.classList.remove('hidden');
                }
            });
        }

        // Select location from search results

            if (checkoutMap) {
                checkoutMap.setView([lat, lng], 16);
                if (checkoutMarker) {
                    checkoutMarker.setLatLng([lat, lng]);

                updateCheckoutLocation(lat, lng);
                document.getElementById('checkout-search-results').classList.add('hidden');

        // Load Saved Addresses for Address Selection
        async function loadSavedAddressesForAddressSelection() {
            try {
                let user = {};
                try { user = JSON.parse(localStorage.getItem('antika_user') || '{}'); } catch(e){ user = {}; }

                if (user.email) {
                    try {
                        const serverUser = await API.getUser(user.email);
                        if (serverUser && Object.keys(serverUser).length > 0) {
                            user = Object.assign({}, serverUser);
                            localStorage.setItem('antika_user', JSON.stringify(user));
                        }
                    } catch (e) {
                        console.warn('Could not sync addresses from server', e);
                    }
                }

                const locations = user.locations || [];
                const addresses = user.addresses || [];
                const combined = [];
                
                locations.forEach((l, i) => combined.push(Object.assign({ _type: 'location', _idx: i }, l)));
                addresses.forEach((a, i) => combined.push(Object.assign({ _type: 'address', _idx: i }, a)));

                const container = document.getElementById('saved-addresses-list');
                const empty = document.getElementById('no-saved-addresses');

                if (!combined || combined.length === 0) {
                    if (empty) empty.classList.remove('hidden');
                    if (container) container.classList.add('hidden');
                    return;
                }

                if (empty) empty.classList.add('hidden');
                if (container) {
                    container.classList.remove('hidden');
                    container.innerHTML = combined.map(item => {
                        const label = item.label || (item._type === 'location' ? `الموقع ${item._idx+1}` : `العنوان ${item._idx+1}`);
                        const details = item.address || (item.lat && item.lng ? `${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}` : 'لا توجد تفاصيل');
                        const isDefault = item.isDefault ? '✓ افتراضي' : '';
                        const icon = item._type === 'location' ? '<i class="fas fa-location-dot text-antika-pink"></i>' : '<i class="fas fa-map text-antika-gold"></i>';
                        
                        return `
                            <div class="p-3 bg-white border border-gray-200 rounded-lg flex items-start justify-between gap-2 hover:border-antika-gold transition">
                                <div class="flex-1">
                                    <div class="font-bold text-sm text-gray-900 flex items-center gap-2">${icon} ${label}</div>
                                    <div class="text-xs text-gray-600 mt-1">${details}</div>
                                    ${isDefault ? `<div class="text-xs text-green-600 mt-1 font-bold">${isDefault}</div>` : ''}
                                </div>
                                <button type="button" class="text-antika-teal hover:text-antika-teal-dark font-bold text-sm px-3 py-1 border border-antika-teal rounded hover:bg-antika-teal hover:text-white transition" onclick="selectAddressInCheckout('${label}', '${details}')">
                                    اختر
                                </button>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Error loading saved addresses:', error);
            }
        }

                    editBtn.addEventListener('click', () => {
                        window.__editAddressIndex = i;
                        document.getElementById('addr-label').value = user.addresses[i].label || '';
                        document.getElementById('addr-text').value = user.addresses[i].address || '';
                    });

                    const delBtn = document.createElement('button');
                    delBtn.className = 'px-3 py-1 border rounded';
                    delBtn.textContent = '🗑️';
                    delBtn.addEventListener('click', async () => {
                        if (!confirm('حذف هذا العنوان؟')) return;
                        // If user has email, try deleting on server
                        if (user.email) {
                            try {
                                const updated = await API.deleteUserAddress(user.email, i);
                                // updated is full user object
                                user = updated || user;
                                localStorage.setItem('antika_user', JSON.stringify(user));
                                renderList();
                                const sel = document.getElementById('saved-addresses-select');
                                if (sel) sel.innerHTML = (user.addresses||[]).map((aa, idx) => `<option value="${idx}">${aa.label || aa.address || ('العنوان ' + (idx+1))}</option>`).join('');
                                return;
                            } catch (err) {
                                console.error('Error deleting address on server:', err);
                                alert('حدث خطأ أثناء حذف العنوان من الخادم. سيتم الحذف محلياً بدلًا من ذلك.');
                            }
                        }

                        // Fallback: delete locally
                        user.addresses.splice(i,1);
                        localStorage.setItem('antika_user', JSON.stringify(user));
                        renderList();
                        const sel = document.getElementById('saved-addresses-select');
                        if (sel) sel.innerHTML = user.addresses.map((aa, idx) => `<option value="${idx}">${aa.label || aa.address || ('العنوان ' + (idx+1))}</option>`).join('');
                    });

                    right.appendChild(editBtn);
                    right.appendChild(delBtn);

                    row.appendChild(left);
                    row.appendChild(right);
                    listEl.appendChild(row);
                });
            }

            renderList();

            // Pick map button
            document.getElementById('addr-pick-map').addEventListener('click', () => {
                window.open('map.html','Map','width=900,height=700');
                const intv = setInterval(()=>{
                    const s = localStorage.getItem('selectedLocation');
                    if (s) {
                        try {
                            const loc = JSON.parse(s);
                            document.getElementById('addr-text').value = `${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}`;
                            clearInterval(intv);
                        } catch(e){}
                    }
                },500);
            });

            // Save address
            document.getElementById('addr-save').addEventListener('click', async () => {
                const label = document.getElementById('addr-label').value.trim();
                const address = document.getElementById('addr-text').value.trim();
                const locRaw = localStorage.getItem('selectedLocation');
                const location = locRaw ? JSON.parse(locRaw) : null;
                const editIdx = window.__editAddressIndex;
                const entry = { label, address, location };

                try {
                    if (typeof editIdx === 'number') {
                        // Update existing
                        if (user.email) {
                            const updated = await API.updateUserAddress(user.email, editIdx, entry);
                            user = updated || user;
                        } else {
                            user.addresses[editIdx] = entry;
                        }
                        window.__editAddressIndex = undefined;
                    } else {
                        // Add new
                        if (user.email) {
                            const updated = await API.addUserAddress(user.email, entry);
                            user = updated || user;
                        } else {
                            user.addresses.push(entry);
                        }
                    }

                    localStorage.setItem('antika_user', JSON.stringify(user));
                    renderList();
                    // refresh checkout saved addresses
                    try { const sel = document.getElementById('saved-addresses-select'); sel.innerHTML = (user.addresses||[]).map((a, idx) => `<option value="${idx}">${a.label || a.address || ('العنوان ' + (idx+1))}</option>`).join(''); document.getElementById('saved-addresses-row').classList.remove('hidden'); } catch(e){}
                } catch (err) {
                    console.error('Error saving address to server:', err);
                    alert('حدث خطأ أثناء حفظ العنوان على الخادم. حاول مرة أخرى.');
                }
            });
        }

        // Check login status
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('antika_user');
            const loginBtn = document.getElementById('login-btn');
            if (isLoggedIn && loginBtn) {
                const user = JSON.parse(isLoggedIn);
                loginBtn.innerHTML = `<i class="fas fa-user-circle text-xl"></i>`;
                loginBtn.href = '#';
                loginBtn.onclick = function(e) {
                    e.preventDefault();
                    showAccountMenu(user);
                };
            }
        }

        // Show account menu (simplified version)
        function showAccountMenu(user) {
            const existingMenu = document.getElementById('account-menu');
            if (existingMenu) {
                existingMenu.remove();
                return;
            }

            const menu = document.createElement('div');
            menu.id = 'account-menu';
            menu.className = 'fixed bg-white shadow-2xl rounded-xl border border-gray-100 z-50';
            menu.style.cssText = 'top: 80px; left: 20px; width: 280px;';
            
            menu.innerHTML = `
                <div class="p-4 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-antika-gold to-antika-pink flex items-center justify-center text-white font-bold">
                            ${user.name ? user.name.charAt(0).toUpperCase() : '👤'}
                        </div>
                        <div>
                            <p class="font-bold text-gray-800 text-sm">${user.name || 'المستخدم'}</p>
                            <p class="text-xs text-gray-500">${user.email || ''}</p>
                        </div>
                    </div>
                </div>
                <div class="py-2">
                    <a href="#" onclick="showNotifications(); return false;" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50">
                        <i class="fas fa-bell text-blue-500"></i>
                        <span>الإشعارات</span>
                    </a>
                    <a href="#" onclick="showOrders(); return false;" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50">
                        <i class="fas fa-shopping-bag text-green-500"></i>
                        <span>الطلبات</span>
                    </a>
                    <a href="wishlist.html" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50">
                        <i class="fas fa-heart text-red-500"></i>
                        <span>المفضلة</span>
                    </a>
                    <a href="#" onclick="showProfile(); return false;" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50">
                        <i class="fas fa-user text-purple-500"></i>
                        <span>حسابي</span>
                    </a>
                    <a href="#" onclick="openAddressesModal(); return false;" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50">
                        <i class="fas fa-map-marker-alt text-antika-gold"></i>
                        <span>عناويني</span>
                    </a>
                    <a href="location.html" class="flex items-center gap-3 px-4 py-2 hover:bg-gray-50">
                        <i class="fas fa-location-dot text-antika-pink"></i>
                        <span>موقعي</span>
                    </a>
                </div>
                <div class="border-t border-gray-100 p-3">
                    <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 text-red-500 hover:bg-red-50 rounded-lg">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>تسجيل الخروج</span>
                    </button>
                </div>
            `;

            document.body.appendChild(menu);

            setTimeout(() => {
                document.addEventListener('click', function closeMenu(e) {
                    if (!menu.contains(e.target) && e.target !== document.getElementById('login-btn')) {
                        menu.remove();
                        document.removeEventListener('click', closeMenu);
                    }
                });
            }, 100);
        }

        // Show notifications
        function showNotifications() {
            window.location.href = 'notifications.html';
        }

        // Show orders
        function showOrders() {
            window.location.href = 'orders.html';
        }

        // Show profile
        function showProfile() {
            window.location.href = 'account.html';
        }

        // Logout
        async function logout() {
            try {
                if (typeof firebase !== 'undefined' && firebase.auth) {
                    await firebase.auth().signOut();
                }
            } catch (e) {
                console.warn('Firebase logout error:', e);
            }
            localStorage.removeItem('antika_user');
            localStorage.removeItem('antika_token');
            window.location.reload();
        }

        // ============================================
        // LOCATION MANAGEMENT IN CHECKOUT
        // ============================================
        let locationPickerMap = null;
        let locationMarker = null;
        let customLocationSelected = null;

        function initializeLocationPicker() {
            // Setup tab switching
            document.querySelectorAll('.location-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchLocationTab(btn.dataset.tab);
                });
            });

            // Load saved location on checkout open
            loadSavedLocationInCheckout();
        }

        async function loadSavedLocationInCheckout() {
            const userRaw = localStorage.getItem('antika_user');
            if (!userRaw) return;

            try {
                const user = JSON.parse(userRaw);
                const result = await API.getUserLocation(user.email);
                
                if (result && result.location && result.location.lat && result.location.lng) {
                    // Show saved location
                    document.getElementById('no-saved-location').classList.add('hidden');
                    document.getElementById('saved-location-display').classList.remove('hidden');
                    document.getElementById('saved-label').textContent = result.label || 'موقعي';
                    document.getElementById('saved-coords').textContent = `${result.location.lat.toFixed(6)}, ${result.location.lng.toFixed(6)}`;
                    
                    // Use saved location by default
                    useSavedLocationInCheckout(result.location);
                } else {
                    document.getElementById('no-saved-location').classList.remove('hidden');
                    document.getElementById('saved-location-display').classList.add('hidden');
                }
            } catch (e) {
                console.error('Error loading saved location:', e);
            }
        }

        function switchLocationTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.location-tab-content').forEach(t => t.classList.add('hidden'));
            // Show selected tab
            document.getElementById('location-' + tab + '-tab').classList.remove('hidden');

            // Update tab button styles
            document.querySelectorAll('.location-tab').forEach(b => {
                b.classList.remove('border-antika-gold', 'text-antika-gold', 'bg-antika-lavender');
                b.classList.add('border-gray-200');
            });
            document.querySelector('[data-tab="' + tab + '"]').classList.add('border-antika-gold', 'text-antika-gold', 'bg-antika-lavender');

            // Initialize map if switching to custom tab
            if (tab === 'custom' && !locationPickerMap) {
                setTimeout(() => initializeLocationPickerMap(), 100);
            }
        }

        function useSavedLocationInCheckout(location) {
            customLocationSelected = location;
            document.getElementById('location-selected-display').classList.remove('hidden');
            document.getElementById('selected-location-coords').textContent = `${location.lat.toFixed(6)}, ${location.lng.toFixed(6)}`;
            localStorage.setItem('selectedLocation', JSON.stringify(location));
        }

        function initializeLocationPickerMap() {
            const mapContainer = document.getElementById('location-picker-map');
            if (!mapContainer || locationPickerMap) return;

            locationPickerMap = L.map(mapContainer).setView([24.7, 46.6], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap',
                maxZoom: 19
            }).addTo(locationPickerMap);

            locationPickerMap.on('click', (e) => {
                customLocationSelected = { lat: e.latlng.lat, lng: e.latlng.lng };
                updateLocationPickerMarker();
                updateCustomLocationInfo();
            });
        }

        function updateLocationPickerMarker() {
            if (locationMarker) {
                locationPickerMap.removeLayer(locationMarker);
            }
            if (customLocationSelected) {
                locationMarker = L.marker([customLocationSelected.lat, customLocationSelected.lng])
                    .addTo(locationPickerMap)
                    .bindPopup(`ًں“چ ${customLocationSelected.lat.toFixed(6)}, ${customLocationSelected.lng.toFixed(6)}`);
                locationPickerMap.setView([customLocationSelected.lat, customLocationSelected.lng], 15);
            }
        }

        function updateCustomLocationInfo() {
            if (customLocationSelected) {
                document.getElementById('custom-location-info').classList.remove('hidden');
                document.getElementById('custom-coords').textContent = `${customLocationSelected.lat.toFixed(6)}, ${customLocationSelected.lng.toFixed(6)}`;
            }
        }

        // Wire up buttons
        document.addEventListener('DOMContentLoaded', () => {
            initializeLocationPicker();

            // Use saved location button
            document.getElementById('use-saved-location-btn')?.addEventListener('click', async (e) => {
                e.preventDefault();
                const userRaw = localStorage.getItem('antika_user');
                if (!userRaw) return;
                const user = JSON.parse(userRaw);
                const result = await API.getUserLocation(user.email);
                if (result && result.location) {
                    useSavedLocationInCheckout(result.location);
                    alert('✅ تم استخدام الموقع المحفوظ');
                }
            });

            // Confirm custom location button
            document.getElementById('confirm-custom-location-btn')?.addEventListener('click', (e) => {
                e.preventDefault();
                if (!customLocationSelected) {
                    alert('اختر موقعاً على الخريطة');
                    return;
                }
                document.getElementById('location-selected-display').classList.remove('hidden');
                document.getElementById('selected-location-coords').textContent = `${customLocationSelected.lat.toFixed(6)}, ${customLocationSelected.lng.toFixed(6)}`;
                localStorage.setItem('selectedLocation', JSON.stringify(customLocationSelected));
                alert('✅ تم تأكيد الموقع المخصص');
            });
        });
    </script>

    <script src="js/auth-sync.js"></script>
    <script src="js/announcement-bar.js"></script>
    <script src="js/footer.js"></script>
</body>
