    <!-- Moyasar Payment Modal -->

    <script src="js/api.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', loadOrdersPage);

        function formatDate(value) {
            const dt = value ? new Date(value) : new Date();
            if (Number.isNaN(dt.getTime())) return '-';
            return dt.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function normalizeOrder(order) {
            return {
                id: order.id || order._id || ('order_' + Date.now()),
                date: order.date || order.createdAt || new Date().toISOString(),
                status: order.status || 'confirming_availability',
                total: Number(order.total || 0),
                items: Array.isArray(order.items) ? order.items : [],
                customerEmail: (order.customerEmail || '').toLowerCase(),
                shippingCity: order.shippingCity || '',
                shippingCost: order.shippingCost,
                weight: order.weight,
                awaitingPaymentSince: order.awaitingPaymentSince,
                isPaid: Boolean(order.isPaid),
                customerCancelled: Boolean(order.customerCancelled),
                customerHidden: Boolean(order.customerHidden),
                cancelReason: order.cancelReason || '',
                cancelledBy: order.cancelledBy || ''
            };
        }

        function getStatusText(status) {
            if (status === 'delivered') return 'تم التوصيل';
            if (status === 'out_for_delivery') return 'جاري التوصيل';
            if (status === 'shipped') return 'تم الشحن';
            if (status === 'awaiting_shipping_payment') return 'بانتظار الدفع';
            if (status === 'processing') return 'قيد التجهيز';
            if (status === 'confirming_availability' || status === 'pending') return 'تأكيد التوفر + احتساب الشحن';
            if (status === 'cancelled') return 'تم إلغاء الطلب';
            return status || 'قيد المعالجة';
        }

        function getStatusClass(status) {
            if (status === 'delivered') return 'bg-green-100 text-green-700';
            if (status === 'out_for_delivery') return 'bg-orange-100 text-orange-700';
            if (status === 'shipped') return 'bg-yellow-100 text-yellow-700';
            if (status === 'awaiting_shipping_payment') return 'bg-orange-100 text-orange-700';
            if (status === 'processing') return 'bg-blue-100 text-blue-700';
            if (status === 'confirming_availability' || status === 'pending') return 'bg-red-100 text-red-700';
            if (status === 'cancelled') return 'bg-red-100 text-red-700';
            return 'bg-gray-100 text-gray-700';
        }

        function renderEmptyState() {
            const container = document.getElementById('orders-container');
            container.className = 'bg-white rounded-xl shadow-sm border p-12 text-center min-h-[400px] flex flex-col items-center justify-center';
            container.innerHTML = `
                <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-6">
                    <i class="fas fa-shopping-bag text-4xl text-gray-300"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">لا توجد طلبات</h2>
                <p class="text-gray-500 mb-6">لم تقم بأي طلب حتى الآن</p>
                <a href="products.html" class="inline-flex items-center gap-2 bg-antika-gold hover:bg-antika-gold-dark text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                    <i class="fas fa-shopping-bag"></i>
                    <span>تسوق الآن</span>
                </a>
            `;
        }

        function buildOrderStepper(order) {
            if (order.status === 'cancelled' || order.customerCancelled) return '';

            const stages = [
                { key: 'confirming_availability', label: 'تأكيد التوفر', icon: 'fa-magnifying-glass' },
                { key: 'paid', label: 'تم الدفع', icon: 'fa-credit-card' },
                { key: 'processing', label: 'قيد التجهيز', icon: 'fa-box' },
                { key: 'shipped', label: 'تم الشحن', icon: 'fa-truck' },
                { key: 'out_for_delivery', label: 'خرج للتوصيل', icon: 'fa-route' },
                { key: 'delivered', label: 'تم التوصيل', icon: 'fa-house' }
            ];

            const rank = { confirming_availability: 0, awaiting_shipping_payment: 1, processing: 2, shipped: 3, out_for_delivery: 4, delivered: 5 };
            const currentRank = rank[order.status] != null ? rank[order.status] : 0;
            const isPastPayment = Boolean(order.isPaid) || currentRank >= 2;

            const states = stages.map((stage, idx) => {
                if (idx === 0) {
                    if (currentRank > 0) return 'done';
                    return 'current';
                }
                if (idx === 1) {
                    if (isPastPayment) return 'done';
                    if (order.status === 'awaiting_shipping_payment') return 'current';
                    return 'upcoming';
                }
                const stageRank = idx + 1;
                if (currentRank > stageRank) return 'done';
                if (currentRank === stageRank) return 'current';
                return 'upcoming';
            });

            const circleClasses = {
                done: 'bg-green-500 text-white',
                current: 'bg-antika-pink text-white',
                upcoming: 'bg-white border-2 border-gray-200 text-gray-300'
            };
            const labelClasses = {
                done: 'text-gray-500',
                current: 'text-antika-pink font-bold',
                upcoming: 'text-gray-300'
            };

            const circlesHtml = stages.map((stage, idx) => {
                const state = states[idx];
                const inner = state === 'done'
                    ? '<i class="fas fa-check" style="font-size:12px;"></i>'
                    : `<i class="fas ${stage.icon}" style="font-size:11px;"></i>`;
                const connector = idx < stages.length - 1
                    ? `<div class="flex-1 h-0.5 mt-3.5 md:mt-4 ${state === 'done' ? 'bg-green-500' : 'bg-gray-200'}"></div>`
                    : '';
                return `
                    <div class="flex flex-col items-center flex-1 min-w-0">
                        <div class="w-7 h-7 md:w-8 md:h-8 rounded-full flex items-center justify-center shrink-0 ${circleClasses[state]}">${inner}</div>
                        <span class="hidden sm:block text-[10px] md:text-xs mt-1.5 text-center leading-tight ${labelClasses[state]}">${stage.label}</span>
                    </div>
                    ${connector}
                `;
            }).join('');

            return `
                <div class="mb-4 pb-4 border-b border-gray-100">
                    <div class="flex items-start">
                        ${circlesHtml}
                    </div>
                </div>
            `;
        }

        function renderOrders(orders, seqMap, unreadOrderIds) {
            unreadOrderIds = unreadOrderIds || new Set();
            const container = document.getElementById('orders-container');
            container.className = 'bg-white rounded-xl shadow-sm border p-4 md:p-6';
            container.innerHTML = `
                <div class="space-y-3">
                    ${orders.map(order => {
                        const orderSeq = seqMap[order.id] || '—';
                        return `
                        <div class="relative border ${order.status === 'awaiting_shipping_payment' ? 'border-orange-300' : 'border-gray-200'} rounded-xl">
                            ${unreadOrderIds.has(order.id) ? `
                            <span id="order-notif-dot-${order.id}" class="absolute -top-2.5 -right-2.5 w-6 h-6 bg-red-500 rounded-full border-2 border-white shadow-md flex items-center justify-center z-20">
                                <i class="fas fa-exclamation text-white" style="font-size:11px;"></i>
                            </span>` : ''}
                            <div class="rounded-xl overflow-hidden">
                            <div class="p-3 flex justify-between items-center gap-2 cursor-pointer select-none flex-wrap" onclick="toggleOrderDetails('${order.id}')">
                                <div class="flex items-center gap-3 flex-wrap">
                                    <span class="font-bold text-gray-800">طلب #${orderSeq}</span>
                                    <span class="text-xs text-gray-400">${formatDate(order.date)}</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="px-3 py-1 rounded-full text-sm font-semibold ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
                                    <span class="font-bold text-antika-gold">${order.total} ر.س</span>
                                    <i id="arrow-${order.id}" class="fas fa-chevron-down text-gray-400 transition-transform"></i>
                                </div>
                            </div>
                            <div id="details-${order.id}" class="hidden border-t border-gray-100 p-4">
                                ${buildOrderStepper(order)}
                                <div class="space-y-2 mb-4">
                                    ${order.items.map(item => `
                                        <div class="flex items-center gap-3 p-2 bg-gray-50 rounded-lg">
                                            <img src="${item.image || ''}" alt="${item.name || ''}" class="w-12 h-12 rounded-lg object-cover bg-gray-200">
                                            <div class="flex-1">
                                                <p class="font-semibold text-sm text-gray-800">${item.name || 'منتج'}</p>
                                                <p class="text-xs text-gray-500">${item.quantity || 1} × ${item.price || 0} ر.س</p>
                                            </div>
                                            <span class="font-bold text-antika-gold text-sm">${(item.quantity || 1) * (item.price || 0)} ر.س</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="border-t pt-3 grid grid-cols-2 gap-2 text-sm text-gray-600 mb-2">
                                    <div>عدد المنتجات: ${order.items.length}</div>
                                    <div>الوزن: ${order.weight ? order.weight + ' كجم' : '-'}</div>
                                    <div>${(order.lat && order.lng) ? `<a href="https://www.google.com/maps?q=${order.lat},${order.lng}" target="_blank" class="text-gray-600 hover:text-antika-gold-dark"><i class="fas fa-map-marker-alt ml-1"></i>عرض موقع العميل على الخريطة</a>` : (order.shippingCity || 'غير محدد')}</div>
                                    <div>الشحن: ${order.shippingCost != null ? Number(order.shippingCost).toFixed(2) + ' ر.س' : '-'}</div>
                                </div>
                                <div class="border-t pt-3 flex items-center justify-between">
                                    <span class="font-bold text-gray-700">الإجمالي</span>
                                    <span class="font-bold text-antika-gold text-lg">${order.total} ر.س</span>
                                </div>
                                ${order.status === 'awaiting_shipping_payment' ? `
                                <div class="mt-4 p-4 bg-gradient-to-l from-antika-pink/10 to-orange-50 border-2 border-antika-pink rounded-xl">
                                    <p class="text-sm text-orange-700 font-semibold mb-3">
                                        <i class="fas fa-triangle-exclamation ml-1"></i>
                                        تم تأكيد توفر منتجاتك، متبقي دفع ${order.total} ر.س (شامل الشحن) لبدء التجهيز.
                                        ${order.awaitingPaymentSince ? ' يجب إتمام الدفع خلال 24 ساعة من هذا الإشعار وإلا سيُلغى الطلب تلقائياً.' : ''}
                                    </p>
                                    <button onclick="payOrder('${order.id}', ${order.total})" class="w-full bg-antika-pink hover:bg-antika-pink-dark text-white text-base font-bold py-3.5 rounded-xl shadow-lg shadow-antika-pink/40 hover:shadow-xl transition-all flex items-center justify-center gap-2">
                                        <i class="fas fa-lock"></i>
                                        أكمل الدفع الآن — ${order.total} ر.س
                                    </button>
                                    <button onclick="cancelOrder('${order.id}')" class="block mx-auto mt-3 bg-red-500 hover:bg-red-600 text-white text-xs font-semibold py-1.5 px-5 rounded-full transition-colors">
                                        إلغاء الطلب
                                    </button>
                                </div>` : ''}
                                ${order.status === 'confirming_availability' ? `
                                <div class="mt-4 text-center">
                                    <button onclick="cancelOrder('${order.id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold py-1.5 px-5 rounded-full transition-colors">
                                        إلغاء الطلب
                                    </button>
                                </div>` : ''}
                                ${order.status === 'cancelled' ? `
                                <div class="mt-4 p-4 bg-yellow-50 border-2 border-yellow-300 rounded-xl">
                                    ${order.cancelReason ? `
                                    <p class="text-sm text-yellow-800">
                                        <i class="fas fa-circle-info ml-1"></i>
                                        <span class="font-bold">سبب الإلغاء:</span> ${order.cancelReason}
                                    </p>` : `
                                    <p class="text-sm text-yellow-800"><i class="fas fa-circle-info ml-1"></i>تم إلغاء هذا الطلب.</p>`}
                                    <button onclick="hideOrderForCustomer('${order.id}')" class="block mx-auto mt-3 bg-white border-2 border-yellow-400 text-yellow-700 hover:bg-yellow-100 text-xs font-semibold py-1.5 px-5 rounded-full transition-colors">
                                        <i class="fas fa-trash ml-1"></i>حذف الطلب من قائمتي
                                    </button>
                                </div>` : ''}
                            </div>
                            </div>
                        </div>
                    `;
                    }).join('')}
                </div>
            `;
        }

        function toggleOrderDetails(orderId) {
            const details = document.getElementById(`details-${orderId}`);
            const arrow = document.getElementById(`arrow-${orderId}`);
            if (!details) return;
            const isOpening = details.classList.contains('hidden');
            details.classList.toggle('hidden');
            if (arrow) arrow.classList.toggle('rotate-180');
            if (isOpening) clearNotificationsForOrder(orderId);
        }

        // يمسح الإشعارات وعلامة التنبيه الخاصة بطلب معيّن بمجرد ما العميل يفتحه
        async function clearNotificationsForOrder(orderId) {
            const dot = document.getElementById('order-notif-dot-' + orderId);
            if (dot) dot.remove();
            if (!currentCustomerEmail) return;
            try {
                await fetch('/api/notifications/by-order?email=' + encodeURIComponent(currentCustomerEmail) + '&orderId=' + encodeURIComponent(orderId), { method: 'DELETE' });
            } catch (e) { console.warn('Could not clear notifications for order:', e); }
            try {
                const header = document.querySelector('antika-header');
                if (header && typeof header.updateNotifCount === 'function') await header.updateNotifCount(currentCustomerEmail);
            } catch (e) { console.warn('Could not refresh header badges:', e); }
            // لو قائمة الحساب المنسدلة مفتوحة، حدّث شارة "الطلبات" جوّاها فوراً بنفس العدد المحدّث
            try {
                const badgeSlot = document.getElementById('account-menu-orders-badge');
                if (badgeSlot) {
                    const count = window.antikaOrderUnreadCount || 0;
                    badgeSlot.innerHTML = count > 0
                        ? `<span class="bg-red-500 text-white text-xs font-bold rounded-full min-w-[20px] h-5 px-1 flex items-center justify-center">${count > 9 ? '9+' : count}</span>`
                        : '';
                }
            } catch (e) { console.warn('Could not refresh account menu badge:', e); }
        }

        function buildSeqMap(allNormalizedOrders) {
            const sortedByDateAsc = [...allNormalizedOrders].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
            const seqMap = {};
            sortedByDateAsc.forEach((o, idx) => { seqMap[o.id] = idx + 1; });
            return seqMap;
        }

        let currentCustomerEmail = '';

        async function loadOrdersPage() {
            const userRaw = localStorage.getItem('antika_user');
            if (!userRaw) { renderEmptyState(); return; }

            const user = JSON.parse(userRaw);
            const email = (user.email || '').toLowerCase();
            currentCustomerEmail = email;

            try {
                const ordersRes = await fetch('/api/orders/customer?email=' + encodeURIComponent(email));
                if (!ordersRes.ok) throw new Error('HTTP ' + ordersRes.status);
                const allOrders = await ordersRes.json();

                let unreadOrderIds = new Set();
                try {
                    const notifRes = await fetch('/api/notifications?email=' + encodeURIComponent(email));
                    if (notifRes.ok) {
                        const notifData = await notifRes.json();
                        (notifData.notifications || []).forEach(n => { if (n.type === 'order' && !n.read && n.orderId) unreadOrderIds.add(n.orderId); });
                    }
                } catch (ne) { console.warn('Could not load notifications:', ne); }

                const allNormalized = (Array.isArray(allOrders) ? allOrders : []).map(normalizeOrder).filter(o => !o.customerCancelled && !o.customerHidden);
                const seqMap = buildSeqMap(allNormalized);
                if (allNormalized.length > 0) { renderOrders(allNormalized, seqMap, unreadOrderIds); focusOrderFromUrl(); return; }
                renderEmptyState();
                return;
            } catch (e) { console.warn('Could not load orders from API:', e); }

            try {
                const localAll = JSON.parse(localStorage.getItem('antika_orders') || '[]').map(normalizeOrder).filter(o => !o.customerCancelled && !o.customerHidden);
                const seqMap = buildSeqMap(localAll);
                const localOrders = localAll.filter(o => !email || o.customerEmail === email);
                if (localOrders.length > 0) { renderOrders(localOrders, seqMap); } else { renderEmptyState(); }
            } catch (e) { renderEmptyState(); }
        }

        // لو وصل العميل من رابط إشعار فيه رقم طلب معيّن (orders.html?order=ID) نفتحله الطلب مباشرة
        function focusOrderFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('order');
            if (!orderId) return;
            const details = document.getElementById('details-' + orderId);
            if (!details) return;
            if (details.classList.contains('hidden')) toggleOrderDetails(orderId);
            setTimeout(() => details.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
        }

        let moyasarPublishableKey = '';
        async function loadMoyasarConfig() {
            try {
                const res = await fetch('/api/payment/config');
                const cfg = await res.json();
                moyasarPublishableKey = cfg.publishableKey || '';
            } catch (e) { console.warn('Could not load Moyasar config:', e); }
        }
        loadMoyasarConfig();

        function closeMoyasarModal() {
            document.getElementById('moyasar-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function payOrder(orderId, amount) {
            if (!moyasarPublishableKey) {
                alert('خدمة الدفع غير متاحة حالياً، حاول لاحقاً أو تواصل معنا.');
                return;
            }
            const container = document.getElementById('moyasar-form-container');
            container.innerHTML = '';
            document.getElementById('moyasar-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            Moyasar.init({
                element: container,
                amount: Math.round(Number(amount) * 100), // halalas
                currency: 'SAR',
                publishable_api_key: moyasarPublishableKey,
                description: 'إتمام دفع الشحن - طلب #' + orderId,
                callback_url: window.location.href,
                methods: ['creditcard'],
                on_completed: async function(payment) {
                    try {
                        const verifyRes = await fetch('/api/payment/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ paymentId: payment.id, orderId })
                        });
                        const verifyData = await verifyRes.json();
                        closeMoyasarModal();
                        if (!verifyData.success) {
                            alert(verifyData.error || 'تعذر التحقق من الدفعة. تواصل مع الدعم.');
                            return;
                        }
                        alert('🎉 تم الدفع بنجاح! بدأنا الآن بتجهيز وتغليف طلبك.');
                        await loadOrdersPage();
                    } catch (err) {
                        console.error('Payment verify error:', err);
                        closeMoyasarModal();
                        alert('تم الدفع لكن حدث خطأ أثناء التأكيد. تواصل مع الدعم.');
                    }
                },
                on_failed: function() {
                    alert('فشلت عملية الدفع. حاول مرة أخرى.');
                    closeMoyasarModal();
                }
            });
        }

        let _pendingCancelOrderId = null;

        function cancelOrder(orderId) {
            if (String(orderId).startsWith('local_')) {
                alert('هذا الطلب غير محفوظ على السيرفر، حدّث الصفحة وحاول مرة أخرى. إذا استمرت المشكلة تواصل معنا.');
                return;
            }
            _pendingCancelOrderId = orderId;
            document.getElementById('cancel-order-reason').value = '';
            document.getElementById('cancel-order-reason-error').classList.add('hidden');
            document.getElementById('cancel-order-modal').classList.remove('hidden');
        }

        function closeCancelOrderModal() {
            document.getElementById('cancel-order-modal').classList.add('hidden');
            _pendingCancelOrderId = null;
        }

        async function submitCancelOrder() {
            const orderId = _pendingCancelOrderId;
            if (!orderId) return;
            const reason = document.getElementById('cancel-order-reason').value.trim();
            if (!reason) {
                document.getElementById('cancel-order-reason-error').classList.remove('hidden');
                document.getElementById('cancel-order-reason').focus();
                return;
            }
            const btn = document.getElementById('cancel-order-confirm-btn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin ml-1"></i>جاري الإلغاء...';
            try {
                const userRaw = localStorage.getItem('antika_user');
                const user = userRaw ? JSON.parse(userRaw) : {};
                const res = await fetch('/api/orders/' + orderId + '/cancel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customerEmail: user.email || '', reason })
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    alert(data.error || 'تعذر إلغاء الطلب');
                    return;
                }
                closeCancelOrderModal();
                alert('تم إلغاء الطلب بنجاح');
                await loadOrdersPage();
            } catch (err) {
                console.error('Cancel order error:', err);
                alert('حدث خطأ أثناء إلغاء الطلب');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        // 🙈 يحذف الطلب من قائمة العميل فقط — لا يمس سجل الطلب بالأدمن إطلاقاً (تحكم مستقل تماماً)
        async function hideOrderForCustomer(orderId) {
            if (!confirm('هل تريد حذف هذا الطلب من قائمة طلباتك؟ لن يظهر لك مرة أخرى.')) return;
            try {
                const userRaw = localStorage.getItem('antika_user');
                const user = userRaw ? JSON.parse(userRaw) : {};
                const res = await fetch('/api/orders/' + orderId + '/hide-for-customer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customerEmail: user.email || '' })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) {
                    alert(data.error || 'تعذر حذف الطلب من قائمتك');
                    return;
                }
                await loadOrdersPage();
            } catch (err) {
                console.error('Hide order error:', err);
                alert('حدث خطأ أثناء حذف الطلب من قائمتك');
            }
        }

        async function logout() {
            try { if (window.Auth && typeof Auth.logout === 'function') await Auth.logout(); } catch (e) {}
            localStorage.removeItem('antika_user');
            localStorage.removeItem('antika_token');
            window.location.href = 'index.html';
        }
    </script>
</body>
