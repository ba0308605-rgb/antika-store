<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>`n    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار الموقع | انتيكا ستور</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: "Tajawal", sans-serif; }
        .page-shell {
            min-height: 100vh;
            background: #f8f8f8;
            display: flex;
            flex-direction: column;
        }
        .page-head {
            background: #ffffff;
            border-bottom: 1px solid #ececec;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 16px;
            padding: 16px;
        }
        #map {
            width: 100%;
            min-height: 520px;
            height: calc(100vh - 120px);
            border-radius: 16px;
            background: #e5e7eb;
        }
        .panel {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #ececec;
            padding: 14px;
            height: fit-content;
        }
        .field-label {
            font-size: 12px;
            color: #737373;
            margin-bottom: 4px;
        }
        .field-value {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            color: #222;
            background: #fafafa;
            border: 1px solid #efefef;
            border-radius: 10px;
            padding: 8px 10px;
            min-height: 36px;
            word-break: break-word;
            direction: ltr;
        }
        .status {
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 5px 10px;
        }
        .status.idle {
            color: #666;
            background: #f3f4f6;
        }
        .status.ok {
            color: #166534;
            background: #dcfce7;
        }
        .search-results {
            border: 1px solid #e7e7e7;
            border-radius: 10px;
            background: #fff;
            max-height: 180px;
            overflow-y: auto;
        }
        .search-row {
            width: 100%;
            text-align: right;
            padding: 8px 10px;
            border-bottom: 1px solid #f3f4f6;
            transition: background-color .2s ease;
        }
        .search-row:hover { background: #f9fafb; }
        .search-row:last-child { border-bottom: 0; }
        .map-actions {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }
        .map-wrap {
            position: relative;
        }
        .map-btn {
            width: 40px;
            height: 40px;
            border-radius: 999px;
            border: 0;
            background: #fff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
            color: #555;
        }
        .error-box {
            border: 1px solid #fecaca;
            background: #fff1f2;
            color: #9f1239;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 13px;
        }
        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }
            #map {
                height: 420px;
                min-height: 420px;
            }
            .map-actions {
                left: 12px;
                top: 12px;
            }
        }
    </style>
    <style id="antika-reset">
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
    </style>
</head>
<body class="text-gray-800">
    <div class="page-shell">
        <header class="page-head">
            <div>
                <h1 class="text-xl md:text-2xl font-extrabold">اختيار موقع التوصيل</h1>
                <p class="text-xs md:text-sm text-gray-500 mt-1">ابحث عن موقعك أو اضغط على الخريطة لتحديده</p>
            </div>
            <button id="close-btn" class="w-10 h-10 rounded-full border border-gray-200 text-gray-500 hover:bg-gray-100" type="button" title="إغلاق">
                <i class="fas fa-times"></i>
            </button>
        </header>

        <main class="layout">
            <section class="map-wrap">
                <div class="map-actions">
                    <button id="current-location-btn" class="map-btn" type="button" title="موقعي الحالي">
                        <i class="fas fa-location-arrow"></i>
                    </button>
                    <button id="clear-btn" class="map-btn" type="button" title="مسح التحديد">
                        <i class="fas fa-eraser"></i>
                    </button>
                </div>
                <div id="map"></div>
            </section>

            <aside class="panel">
                <div id="map-error" class="error-box hidden mb-3"></div>

                <div class="mb-3">
                    <label for="search-address" class="block text-sm font-bold mb-2">بحث عن عنوان أو معلم</label>
                    <input id="search-address" type="text" class="w-full border-2 border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-[#D6C1A6]" placeholder="مثال: مطعم، مسجد، حي...">
                    <div id="search-results" class="search-results hidden mt-2"></div>
                </div>

                <div class="mb-3">
                    <span id="status" class="status idle">
                        <i class="fas fa-circle text-[9px]"></i>
                        لم يتم تحديد موقع بعد
                    </span>
                </div>

                <div class="space-y-2">
                    <div>
                        <div class="field-label">Latitude</div>
                        <div id="lat-display" class="field-value">--</div>
                    </div>
                    <div>
                        <div class="field-label">Longitude</div>
                        <div id="lng-display" class="field-value">--</div>
                    </div>
                    <div>
                        <div class="field-label">العنوان</div>
                        <div id="address-display" class="field-value" style="direction: rtl; font-family: 'Tajawal', sans-serif;">لم يتم تحديد عنوان</div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mt-4">
                    <button id="copy-btn" type="button" class="col-span-1 border border-gray-200 rounded-xl py-2 text-sm hover:bg-gray-50">
                        <i class="fas fa-copy ml-1"></i> نسخ
                    </button>
                    <button id="confirm-btn" type="button" class="col-span-2 rounded-xl py-2 text-sm font-bold bg-[#D6C1A6] text-white disabled:opacity-40 disabled:cursor-not-allowed">
                        <i class="fas fa-check ml-1"></i> تأكيد الموقع
                    </button>
                </div>
            </aside>
        </main>
    </div>

    <script src="js/maps-provider.js"></script>
    <script>
        const DEFAULT_CENTER = { lat: 24.7136, lng: 46.6753 };
        const DEFAULT_ZOOM = 13;

        let map;
        let marker = null;
        let geocoder = null;
        let autocompleteService = null;
        let predictions = [];
        let selectedLocation = null;
        let searchDebounce = null;

        const el = {
            map: document.getElementById("map"),
            mapError: document.getElementById("map-error"),
            search: document.getElementById("search-address"),
            results: document.getElementById("search-results"),
            status: document.getElementById("status"),
            lat: document.getElementById("lat-display"),
            lng: document.getElementById("lng-display"),
            address: document.getElementById("address-display"),
            confirmBtn: document.getElementById("confirm-btn"),
            copyBtn: document.getElementById("copy-btn")
        };

        function setStatus(message, kind) {
            el.status.className = `status ${kind === "ok" ? "ok" : "idle"}`;
            el.status.innerHTML = `<i class="fas fa-circle text-[9px]"></i>${message}`;
        }

        function showMapError(message) {
            el.mapError.textContent = message;
            el.mapError.classList.remove("hidden");
        }

        function hideMapError() {
            el.mapError.classList.add("hidden");
            el.mapError.textContent = "";
        }

        function updateInfoPanel() {
            if (!selectedLocation) {
                el.lat.textContent = "--";
                el.lng.textContent = "--";
                el.address.textContent = "لم يتم تحديد عنوان";
                el.confirmBtn.disabled = true;
                setStatus("لم يتم تحديد موقع بعد", "idle");
                return;
            }

            el.lat.textContent = selectedLocation.lat.toFixed(6);
            el.lng.textContent = selectedLocation.lng.toFixed(6);
            el.address.textContent = selectedLocation.address || `${selectedLocation.lat.toFixed(6)}, ${selectedLocation.lng.toFixed(6)}`;
            el.confirmBtn.disabled = false;
            setStatus("تم تحديد الموقع", "ok");
        }

        function clearSelectedLocation() {
            selectedLocation = null;
            if (marker) {
                marker.setMap(null);
                marker = null;
            }
            updateInfoPanel();
        }

        async function reverseGeocode(lat, lng) {
            if (!geocoder) return "";
            return new Promise((resolve) => {
                geocoder.geocode({ location: { lat, lng } }, (results, status) => {
                    if (status === "OK" && Array.isArray(results) && results[0]) {
                        return resolve(results[0].formatted_address || "");
                    }
                    resolve("");
                });
            });
        }

        async function setSelectedLocation(lat, lng, addressHint = "") {
            const safeLat = Number(lat);
            const safeLng = Number(lng);
            if (!Number.isFinite(safeLat) || !Number.isFinite(safeLng)) return;

            if (!marker) {
                marker = new google.maps.Marker({
                    map,
                    draggable: true
                });
                marker.addListener("dragend", async () => {
                    const pos = marker.getPosition();
                    await setSelectedLocation(pos.lat(), pos.lng());
                });
            }

            marker.setPosition({ lat: safeLat, lng: safeLng });
            map.panTo({ lat: safeLat, lng: safeLng });
            map.setZoom(Math.max(map.getZoom() || DEFAULT_ZOOM, 15));

            let address = addressHint;
            if (!address) {
                address = await reverseGeocode(safeLat, safeLng);
            }

            selectedLocation = {
                lat: safeLat,
                lng: safeLng,
                address: address || ""
            };

            updateInfoPanel();
        }

        function renderSearchResults(list) {
            predictions = list;
            if (!Array.isArray(list) || list.length === 0) {
                el.results.innerHTML = '<div class="px-3 py-2 text-xs text-gray-500">لا توجد نتائج</div>';
                el.results.classList.remove("hidden");
                return;
            }

            el.results.innerHTML = list.map((item, idx) => {
                const title = item.structured_formatting && item.structured_formatting.main_text
                    ? item.structured_formatting.main_text
                    : item.description;
                const sub = item.structured_formatting && item.structured_formatting.secondary_text
                    ? item.structured_formatting.secondary_text
                    : "";
                return `
                    <button type="button" class="search-row" onclick="selectGoogleSearchResult(${idx})">
                        <div class="text-sm font-bold text-gray-900">${title}</div>
                        <div class="text-xs text-gray-500">${sub || item.description}</div>
                    </button>
                `;
            }).join("");
            el.results.classList.remove("hidden");
        }

        async function searchPlaces(query) {
            if (!autocompleteService || query.length < 3) {
                el.results.classList.add("hidden");
                return;
            }

            const list = await new Promise((resolve) => {
                autocompleteService.getPlacePredictions({
                    input: query,
                    language: "ar",
                    componentRestrictions: { country: "sa" },
                    types: ["establishment", "geocode"]
                }, (items, status) => {
                    if (status !== google.maps.places.PlacesServiceStatus.OK || !Array.isArray(items)) {
                        return resolve([]);
                    }
                    resolve(items.slice(0, 8));
                });
            });

            renderSearchResults(list);
        }

        async function selectGoogleSearchResult(index) {
            const item = predictions[index];
            if (!item || !geocoder) return;

            const results = await new Promise((resolve) => {
                geocoder.geocode({ placeId: item.place_id }, (out, status) => {
                    if (status !== "OK" || !Array.isArray(out)) return resolve([]);
                    resolve(out);
                });
            });

            if (!results[0]) return;
            const loc = results[0].geometry.location;
            await setSelectedLocation(loc.lat(), loc.lng(), results[0].formatted_address || item.description);
            el.search.value = item.description || "";
            el.results.classList.add("hidden");
        }

        async function useCurrentLocation() {
            if (!navigator.geolocation) {
                alert("المتصفح لا يدعم تحديد الموقع");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    await setSelectedLocation(pos.coords.latitude, pos.coords.longitude);
                },
                () => {
                    alert("تعذر الحصول على موقعك الحالي");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        async function copySelectedLocation() {
            if (!selectedLocation) {
                alert("حدد موقعًا أولًا");
                return;
            }

            const text = `${selectedLocation.lat.toFixed(6)}, ${selectedLocation.lng.toFixed(6)}`;
            try {
                await navigator.clipboard.writeText(text);
                const old = el.copyBtn.innerHTML;
                el.copyBtn.innerHTML = '<i class="fas fa-check ml-1"></i> تم النسخ';
                setTimeout(() => {
                    el.copyBtn.innerHTML = old;
                }, 1200);
            } catch (_) {
                alert(text);
            }
        }

        function persistLocationToUser(location) {
            try {
                const userRaw = localStorage.getItem("antika_user");
                if (!userRaw) return;
                const user = JSON.parse(userRaw);
                const normalized = {
                    lat: location.lat,
                    lng: location.lng,
                    label: "موقعي",
                    address: location.address || ""
                };
                const locations = Array.isArray(user.locations) ? user.locations : [];
                user.locations = [normalized, ...locations].slice(0, 5);
                localStorage.setItem("antika_user", JSON.stringify(user));
            } catch (_) {}
        }

        function confirmLocation() {
            if (!selectedLocation) {
                alert("حدد موقعًا أولًا");
                return;
            }

            const payload = {
                lat: selectedLocation.lat,
                lng: selectedLocation.lng,
                label: "موقعي",
                address: selectedLocation.address || ""
            };

            localStorage.setItem("selectedLocation", JSON.stringify(payload));
            persistLocationToUser(payload);

            alert("تم حفظ الموقع بنجاح");

            if (window.opener && !window.opener.closed) {
                window.close();
                return;
            }
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            window.location.href = "cart.html";
        }

        async function ensureGoogleMapsReady() {
            if (!window.MapsProvider || typeof window.MapsProvider.getConfig !== "function") {
                throw new Error("Maps runtime helper is not available");
            }

            const cfg = await window.MapsProvider.getConfig();
            if (!cfg || !cfg.googleMapsEnabled || !cfg.googleMapsApiKey) {
                throw new Error("Google Maps API key is not configured on server");
            }

            await window.MapsProvider.loadGoogleMapsApi(cfg.googleMapsApiKey);
        }

        async function init() {
            updateInfoPanel();

            try {
                await ensureGoogleMapsReady();
                hideMapError();

                map = new google.maps.Map(el.map, {
                    center: DEFAULT_CENTER,
                    zoom: DEFAULT_ZOOM,
                    mapTypeControl: false,
                    streetViewControl: false,
                    fullscreenControl: false,
                    gestureHandling: "greedy"
                });
                geocoder = new google.maps.Geocoder();
                autocompleteService = new google.maps.places.AutocompleteService();

                map.addListener("click", async (e) => {
                    await setSelectedLocation(e.latLng.lat(), e.latLng.lng());
                });

                const saved = localStorage.getItem("selectedLocation");
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Number.isFinite(Number(parsed.lat)) && Number.isFinite(Number(parsed.lng))) {
                            await setSelectedLocation(Number(parsed.lat), Number(parsed.lng), parsed.address || "");
                        }
                    } catch (_) {}
                }
            } catch (error) {
                showMapError("تعذر تحميل Google Maps. تأكد من إعداد المفتاح وصلاحيات الدومين.");
                console.error(error);
            }
        }

        window.selectGoogleSearchResult = selectGoogleSearchResult;

        document.getElementById("close-btn").addEventListener("click", () => {
            if (window.history.length > 1) window.history.back();
            else window.location.href = "cart.html";
        });
        document.getElementById("current-location-btn").addEventListener("click", useCurrentLocation);
        document.getElementById("clear-btn").addEventListener("click", clearSelectedLocation);
        el.copyBtn.addEventListener("click", copySelectedLocation);
        el.confirmBtn.addEventListener("click", confirmLocation);
        el.search.addEventListener("input", (e) => {
            const query = e.target.value.trim();
            window.clearTimeout(searchDebounce);
            searchDebounce = window.setTimeout(() => {
                searchPlaces(query).catch((err) => {
                    console.error(err);
                    el.results.innerHTML = '<div class="px-3 py-2 text-xs text-red-500">تعذر تنفيذ البحث</div>';
                    el.results.classList.remove("hidden");
                });
            }, 250);
        });

        document.addEventListener("click", (e) => {
            if (!el.results.contains(e.target) && e.target !== el.search) {
                el.results.classList.add("hidden");
            }
        });

        init();
    </script>
</body>
</html>
